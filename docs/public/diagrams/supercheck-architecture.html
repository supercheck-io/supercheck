<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supercheck Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      /* Theme: resolve before first paint. When this file is framed by the
         docs page (same origin), follow the embedding page's theme class so
         the diagram matches the site's light/dark toggle; otherwise fall back
         to the OS preference. An explicit ?theme=light|dark wins for testing. */
      function resolve() {
        try {
          var param = new URLSearchParams(window.location.search).get('theme');
          if (param === 'light' || param === 'dark') return param;
        } catch (_) {}
        try {
          if (window.parent && window.parent !== window) {
            var cl = window.parent.document.documentElement.classList;
            if (cl.contains('dark')) return 'dark';
            if (cl.contains('light')) return 'light';
          }
        } catch (_) {}
        try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (_) {}
        return 'light';
      }
      function apply() { document.documentElement.setAttribute('data-theme', resolve()); }
      apply();
      try {
        if (window.parent && window.parent !== window) {
          new MutationObserver(apply).observe(window.parent.document.documentElement, {
            attributes: true, attributeFilter: ['class']
          });
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply);
      } catch (_) {}

      /* Hover flow ("intent trace"): hovering or focusing a component dims
         unrelated elements, keeps its topology lit, glows the component, and
         runs a short signal over each related edge once. Static meaning is
         unchanged without JavaScript or with reduced motion. */
      function initFlow() {
        var svg = document.querySelector('svg');
        if (!svg) return;
        var flowLayer = document.getElementById('sa-flow-layer');
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        var nodes = {};
        var edges = Array.prototype.slice.call(svg.querySelectorAll('.eg'));
        var active = null;

        svg.querySelectorAll('.ng').forEach(function (g) { nodes[g.getAttribute('data-node')] = g; });

        function clear() {
          active = null;
          svg.querySelectorAll('.dim').forEach(function (el) { el.classList.remove('dim'); });
          svg.querySelectorAll('.hot').forEach(function (el) { el.classList.remove('hot'); });
          flowLayer.textContent = '';
        }

        function focusNode(id) {
          if (!nodes[id] || active === id) return;
          clear();
          active = id;
          var connected = {};
          connected[id] = true;
          edges.forEach(function (g) {
            var f = g.getAttribute('data-from'), t = g.getAttribute('data-to');
            if (f === id || t === id) { connected[f] = true; connected[t] = true; }
          });
          Object.keys(nodes).forEach(function (nid) {
            if (!connected[nid]) nodes[nid].classList.add('dim');
          });
          nodes[id].classList.add('hot');
          edges.forEach(function (g) {
            var f = g.getAttribute('data-from'), t = g.getAttribute('data-to');
            if (f !== id && t !== id) { g.classList.add('dim'); return; }
            if (reduceMotion.matches) return;
            var geo = g.querySelector('.ep');
            if (!geo) return;
            var echo = geo.cloneNode(false);
            echo.removeAttribute('marker-end');
            echo.setAttribute('pathLength', '1');
            echo.setAttribute('class', 'flow ' + (f === id ? 'out' : 'in'));
            flowLayer.appendChild(echo);
            echo.addEventListener('animationend', function () { echo.remove(); });
          });
        }

        Object.keys(nodes).forEach(function (id) {
          var g = nodes[id];
          g.addEventListener('mouseenter', function () { focusNode(id); });
          g.addEventListener('mouseleave', clear);
          g.addEventListener('focus', function () { focusNode(id); });
          g.addEventListener('blur', clear);
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initFlow);
      } else {
        initFlow();
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #0a0a0a; --muted: #707070; --soft: #858585;
      --accent: #16a34a; --link: #2a6df4; --glow: rgba(22,163,74,0.45);
      --zone-fill: rgba(10,10,10,0.02); --zone-stroke: rgba(10,10,10,0.10); --zone-label: rgba(10,10,10,0.40);
      --focal-fill: rgba(22,163,74,0.08); --focal-stroke: #16a34a; --focal-chip: rgba(22,163,74,0.50);
      --backend-fill: #ffffff; --backend-stroke: #0a0a0a; --backend-chip: rgba(10,10,10,0.40);
      --store-fill: rgba(10,10,10,0.05); --store-stroke: #707070; --store-chip: rgba(112,112,112,0.50);
      --ext-fill: rgba(10,10,10,0.03); --ext-stroke: rgba(10,10,10,0.30); --ext-chip: rgba(10,10,10,0.22);
      --input-fill: rgba(112,112,112,0.10); --input-stroke: #858585; --input-chip: rgba(133,133,133,0.40);
      --sec-fill: rgba(22,163,74,0.05); --sec-stroke: rgba(22,163,74,0.50);
      --font-name: 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    }
    html[data-theme="dark"] {
      --paper: #121212; --ink: #ebebeb; --muted: #b3b3b3; --soft: #9a9a9a;
      --accent: #22c55e; --link: #5a8df7; --glow: rgba(34,197,94,0.45);
      --zone-fill: rgba(235,235,235,0.03); --zone-stroke: rgba(235,235,235,0.10); --zone-label: rgba(235,235,235,0.35);
      --focal-fill: rgba(34,197,94,0.08); --focal-stroke: #22c55e; --focal-chip: rgba(34,197,94,0.50);
      --backend-fill: #1e1e1e; --backend-stroke: #ebebeb; --backend-chip: rgba(235,235,235,0.40);
      --store-fill: rgba(235,235,235,0.05); --store-stroke: #b3b3b3; --store-chip: rgba(179,179,179,0.50);
      --ext-fill: rgba(235,235,235,0.03); --ext-stroke: rgba(235,235,235,0.30); --ext-chip: rgba(235,235,235,0.22);
      --input-fill: rgba(154,154,154,0.10); --input-stroke: #9a9a9a; --input-chip: rgba(154,154,154,0.40);
      --sec-fill: rgba(34,197,94,0.05); --sec-stroke: rgba(34,197,94,0.50);
    }
    body {
      font-family: var(--font-name);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 0; display: block; }

    /* Diagram typography */
    .tname { font-family: var(--font-name); font-size: 12px; font-weight: 600; fill: var(--ink); }
    .tsub { font-family: var(--font-mono); font-size: 9px; fill: var(--muted); }
    .tchip { font-family: var(--font-mono); font-size: 7px; letter-spacing: 0.08em; }
    .tzone { font-family: var(--font-mono); font-size: 7px; letter-spacing: 0.14em; fill: var(--zone-label); }
    .tlabel { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; }
    .lbl-muted { fill: var(--muted); }
    .lbl-accent { fill: var(--accent); }
    .lbl-link { fill: var(--link); }
    .tlegend { font-family: var(--font-name); font-size: 8.5px; fill: var(--muted); }
    .tlegend-mono { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.18em; fill: var(--muted); }

    /* Themeable primitives */
    .mask { fill: var(--paper); }
    .bg { fill: var(--paper); }
    .ruleline { stroke: var(--zone-stroke); stroke-width: 0.8; }
    .zone { fill: var(--zone-fill); stroke: var(--zone-stroke); stroke-width: 0.8; }
    .nd { stroke-width: 1; }
    .nd-focal { fill: var(--focal-fill); stroke: var(--focal-stroke); }
    .nd-backend { fill: var(--backend-fill); stroke: var(--backend-stroke); }
    .nd-store { fill: var(--store-fill); stroke: var(--store-stroke); }
    .nd-external { fill: var(--ext-fill); stroke: var(--ext-stroke); }
    .nd-input { fill: var(--input-fill); stroke: var(--input-stroke); }
    .nd-security { fill: var(--sec-fill); stroke: var(--sec-stroke); stroke-dasharray: 4 4; }
    .chip { fill: transparent; stroke-width: 0.8; }
    .chip-focal, .chip-security { stroke: var(--focal-chip); }
    .chip-backend { stroke: var(--backend-chip); }
    .chip-store { stroke: var(--store-chip); }
    .chip-external { stroke: var(--ext-chip); }
    .chip-input { stroke: var(--input-chip); }
    .tag-focal, .tag-security { fill: var(--accent); }
    .tag-backend { fill: var(--ink); }
    .tag-store { fill: var(--muted); }
    .tag-external, .tag-input { fill: var(--soft); }
    .edge { fill: none; stroke-width: 1.2; }
    .e-muted { stroke: var(--muted); }
    .e-accent { stroke: var(--accent); stroke-width: 1.4; }
    .e-link { stroke: var(--link); }
    .e-dash { stroke-width: 1; stroke-dasharray: 4 3; }
    #sa-arrow polygon { fill: var(--muted); }
    #sa-arrow-accent polygon { fill: var(--accent); }
    #sa-arrow-link polygon { fill: var(--link); }

    /* Hover flow ("intent trace"): unrelated elements dim, related topology
       stays lit, the hovered node glows, and a short signal runs over each
       related edge once. Mirrors the interactive viewer behaviour. */
    .ng, .eg { transition: opacity 140ms ease; }
    .ng { outline: none; }
    .dim { opacity: 0.2; }
    .ng.hot { filter: drop-shadow(0 0 10px var(--glow)); }
    .flow-layer { pointer-events: none; }
    .flow {
      fill: none; stroke-width: 3.1; stroke-linecap: round;
      stroke-dasharray: 0.1 0.9; stroke-dashoffset: 0;
      vector-effect: non-scaling-stroke; opacity: 0.94;
      animation: sa-flow 1.15s linear 1 both;
    }
    .flow.out { stroke: var(--accent); filter: drop-shadow(0 0 4px var(--glow)); }
    .flow.in { stroke: var(--link); filter: drop-shadow(0 0 4px var(--glow)); }
    @keyframes sa-flow {
      0% { opacity: 0.28; stroke-dashoffset: 0; }
      12%, 78% { opacity: 0.94; }
      100% { opacity: 0; stroke-dashoffset: -1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ng, .eg { transition: none; }
      .ng.hot { filter: none; }
      .flow { display: none; }
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
<div class="sr-only"><h1>Supercheck</h1></div>

  <div class="diagram-container">
    <svg viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="archify-diagram-title sc-arch-desc">

        <marker id="sa-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6"/></marker>
      </defs>

        <rect class="mask" x="188" y="273" width="36" height="12" rx="2"/>
        <text class="tlabel lbl-link" x="206" y="283" text-anchor="middle">HTTPS</text>
      </g>
      <g class="eg" data-from="cli" data-to="app">
        <path class="ep edge e-muted e-dash" d="M 110,184 V 244 Q 110,252 118,252 H 292 Q 300,252 300,260 V 272" marker-end="url(#sa-arrow)"/>
        <rect class="mask" x="169" y="232" width="52" height="12" rx="2"/>
        <text class="tlabel lbl-muted" x="195" y="242" text-anchor="middle">REST API</text>
      </g>
      <g class="eg" data-from="auth" data-to="app">
        <line class="ep edge e-accent e-dash" x1="360" y1="184" x2="360" y2="272" marker-end="url(#sa-arrow-accent)"/>
        <rect class="mask" x="366" y="214" width="52" height="12" rx="2"/>
        <text class="tlabel lbl-accent" x="392" y="224" text-anchor="middle">SESSIONS</text>
      </g>
      <g class="eg" data-from="scheduler" data-to="queue">
        <line class="ep edge e-muted" x1="635" y1="184" x2="635" y2="272" marker-end="url(#sa-arrow)"/>
        <rect class="mask" x="641" y="214" width="32" height="12" rx="2"/>

      </g>

        <line class="ep edge e-accent" x1="408" y1="296" x2="560" y2="296" marker-end="url(#sa-arrow-accent)"/>
        <rect class="mask" x="446" y="276" width="76" height="12" rx="2"/>
        <text class="tlabel lbl-accent" x="484" y="286" text-anchor="middle">ENQUEUE RUNS</text>
      </g>

        <rect class="mask" x="986" y="284" width="48" height="12" rx="2"/>

      <!-- Nodes -->

      </g>

        <rect class="mask" x="280" y="128" width="160" height="56" rx="6"/>

        <rect class="chip chip-security" x="288" y="136" width="32" height="12" rx="2"/>

      </g>

        <rect class="mask" x="48" y="272" width="128" height="64" rx="6"/>
