# Compatibility entry point. New installations use docker-compose.yml with COMPOSE_PROFILES=https.
name: supercheck

services:
  traefik:
    extends:
      file: docker-compose.yml
      service: traefik
    profiles: !reset []
  app:
    extends:
      file: docker-compose.yml
      service: app
    ports: !reset []
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://${APP_DOMAIN:-localhost}}
      APP_URL: ${APP_URL:-https://${APP_DOMAIN:-localhost}}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://${APP_DOMAIN:-localhost}}
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.5"
          memory: 3G
  worker:
    extends:
      file: docker-compose.yml
      service: worker
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
  redis:
    extends:
      file: docker-compose.yml
      service: redis
  minio:
    extends:
      file: docker-compose.yml
      service: minio
  private-agent:
    extends:
      file: docker-compose.yml
      service: private-agent

volumes:
  postgres-data:
  redis-data:
  minio-data:
  worker-playwright-reports:
  worker-k6-reports:
  worker-reports:
  traefik-letsencrypt:
  private-agent-state:

networks:
  supercheck-network:
  private-agent-network:
