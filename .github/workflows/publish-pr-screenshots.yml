name: Publish PR Screenshots

# Runs after "PR Screenshots" with repository secrets, so it only ever executes
# default-branch code and treats the downloaded artifact as untrusted data
# (.github/scripts/pr-screenshots.mjs validates every file).
#
# Pull request runs get a visual review page compared against the main baseline and a
# sticky PR comment. Default-branch runs (push or manual) publish their own page and, when
# they pass, replace baselines/main/manifest.json, unless a newer commit already owns it.
#
# Hosting is optional. With the R2 secrets and variables below unset, the comment
# links the run artifact instead of showing thumbnails.
#   secrets: PR_SCREENSHOTS_R2_ACCESS_KEY_ID, PR_SCREENSHOTS_R2_SECRET_ACCESS_KEY
#   vars:    PR_SCREENSHOTS_R2_ENDPOINT, PR_SCREENSHOTS_R2_BUCKET, PR_SCREENSHOTS_PUBLIC_URL
on:
  workflow_run:
    workflows: ["PR Screenshots"]
    types: [completed]

permissions: {}

concurrency:
  group: publish-pr-screenshots-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish PR Screenshots
    if: >-
      contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
      # The "Visual review" commit status links the gallery from the PR's checks list.
      statuses: write

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # A fork can name its branch "main", so a baseline run must also come from this repository.
      - name: Classify run
        id: run
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mode="skip"
          if [[ "$EVENT" == "pull_request" ]]; then
            mode="pr"
          elif [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" && "$HEAD_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            mode="main"
          fi
          echo "Publishing as: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # Fork PRs leave workflow_run.pull_requests empty, so match by head branch and SHA.
      # A run for an older commit matches no open PR head and is skipped.
      - name: Resolve pull request
        id: pr
        if: steps.run.outputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f head="${HEAD_OWNER}:${HEAD_BRANCH}" -f per_page=100 \
            | jq --arg sha "$HEAD_SHA" '[.[] | select(.head.sha == $sha)]' > "$RUNNER_TEMP/pulls.json"
          number="$(jq -r 'if length == 1 then .[0].number else empty end' "$RUNNER_TEMP/pulls.json")"
          if [[ ! "$number" =~ ^[1-9][0-9]*$ ]]; then
            echo "No open pull request has head ${HEAD_SHA}; skipping."
            number=""
          else
            # Author-controlled text goes to a file the gallery script validates, never to GITHUB_OUTPUT.
            jq '.[0] | {title, author: .user.login, head: (if .head.repo.full_name == .base.repo.full_name then .head.ref else .head.label end), base: .base.ref}' "$RUNNER_TEMP/pulls.json" > "$RUNNER_TEMP/pr.json"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Decide destination
        id: dest
        if: steps.run.outputs.mode == 'main' || steps.pr.outputs.number != ''
        env:
          MODE: ${{ steps.run.outputs.mode }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          R2_ENDPOINT: ${{ vars.PR_SCREENSHOTS_R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.PR_SCREENSHOTS_R2_BUCKET }}
          PUBLIC_URL: ${{ vars.PR_SCREENSHOTS_PUBLIC_URL }}
          RUN_KEY: ${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
        run: |
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if [[ -z "$R2_BUCKET" ]]; then
            echo "R2 is not configured; the comment will link the run artifact."
            exit 0
          fi
          [[ "$R2_BUCKET" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::Invalid bucket name"; exit 1; }
          [[ "$R2_ENDPOINT" == https://* && "$PUBLIC_URL" == https://* ]] || { echo "::error::R2 endpoint and public URL must be https"; exit 1; }
          # Keyed by run attempt, so immutable caching never serves stale bytes after a re-run.
          if [[ "$MODE" == "pr" ]]; then root="prs/${PR_NUMBER}"; else root="main"; fi
          prefix="${root}/${RUN_KEY}"
          {
            echo "hosted=true"
            echo "prefix=$prefix"
            echo "base_url=${PUBLIC_URL%/}/${prefix}"
            # A stable page that always forwards to the newest gallery for this PR or for main.
            echo "latest_key=${root}/index.html"
            echo "latest_url=${PUBLIC_URL%/}/${root}/index.html"
          } >> "$GITHUB_OUTPUT"

      - name: Download screenshots
        if: steps.dest.outputs.publish == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          name: pr-screenshots
          path: ${{ runner.temp }}/artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Missing or unreadable means no comparison labels, never a failed publish.
      - name: Download main baseline
        if: steps.run.outputs.mode == 'pr' && steps.dest.outputs.hosted == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PR_SCREENSHOTS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PR_SCREENSHOTS_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ vars.PR_SCREENSHOTS_R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.PR_SCREENSHOTS_R2_BUCKET }}
        run: |
          aws s3 cp "s3://${R2_BUCKET}/baselines/main/manifest.json" "$RUNNER_TEMP/baseline.json" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            || { echo "::notice::No main screenshot baseline yet; frames will not be labelled New or Changed."; rm -f "$RUNNER_TEMP/baseline.json"; }

      - name: Prepare gallery
        if: steps.dest.outputs.publish == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.number && format('{0}/{1}/pull/{2}', github.server_url, github.repository, steps.pr.outputs.number) || '' }}
          GALLERY_BASE_URL: ${{ steps.dest.outputs.base_url }}
          PUBLIC_URL: ${{ vars.PR_SCREENSHOTS_PUBLIC_URL }}
        run: |
          [[ -f "$RUNNER_TEMP/pr.json" ]] && export PR_INFO="$RUNNER_TEMP/pr.json"
          mkdir -p "$RUNNER_TEMP/artifact"
          baseline=()
          [[ -f "$RUNNER_TEMP/baseline.json" ]] && baseline=("$RUNNER_TEMP/baseline.json")
          node .github/scripts/pr-screenshots.mjs prepare "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/gallery" "${baseline[@]}"

      # On failure the comment falls back to linking the run artifact.
      - name: Upload gallery to R2
        id: upload
        if: steps.dest.outputs.hosted == 'true'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PR_SCREENSHOTS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PR_SCREENSHOTS_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ vars.PR_SCREENSHOTS_R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.PR_SCREENSHOTS_R2_BUCKET }}
          PREFIX: ${{ steps.dest.outputs.prefix }}
          BASE_URL: ${{ steps.dest.outputs.base_url }}
        run: |
          if compgen -G "$RUNNER_TEMP/gallery/images/*.png" > /dev/null; then
            aws s3 cp "$RUNNER_TEMP/gallery/images/" "s3://${R2_BUCKET}/${PREFIX}/images/" --recursive \
              --endpoint-url "$R2_ENDPOINT" --content-type image/png --cache-control "public,max-age=31536000,immutable"
          fi
          aws s3 cp "$RUNNER_TEMP/gallery/index.html" "s3://${R2_BUCKET}/${PREFIX}/index.html" \
            --endpoint-url "$R2_ENDPOINT" --content-type "text/html; charset=utf-8" --cache-control "public,max-age=300"
          echo "Published ${BASE_URL}/index.html"

      # Only a passing default-branch run whose images were uploaded becomes the baseline,
      # and never over a baseline from a newer commit (for example after re-running an old run).
      - name: Update main baseline
        if: >-
          steps.run.outputs.mode == 'main' &&
          github.event.workflow_run.conclusion == 'success' &&
          steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PR_SCREENSHOTS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PR_SCREENSHOTS_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ vars.PR_SCREENSHOTS_R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.PR_SCREENSHOTS_R2_BUCKET }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$(jq '.shots | length' "$RUNNER_TEMP/gallery/manifest.json")" == "0" ]]; then
            echo "::warning::No checkpoints captured; keeping the current baseline."
            exit 0
          fi
          uri="s3://${R2_BUCKET}/baselines/main/manifest.json"
          # Only a missing object means "no baseline yet"; any other read error must not
          # let an older run overwrite a newer baseline.
          if aws s3 cp "$uri" "$RUNNER_TEMP/current.json" --endpoint-url "$R2_ENDPOINT" --only-show-errors 2>"$RUNNER_TEMP/current.err"; then
            current="$(jq -r '.sha // empty' "$RUNNER_TEMP/current.json" 2>/dev/null || true)"
            if [[ "$current" =~ ^[0-9a-f]{40}$ && "$current" != "$SHA" ]]; then
              # A baseline commit GitHub no longer knows (404, for example after a force-push) is
              # replaced; any other API failure keeps the baseline and fails the step.
              if ! status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current}...${SHA}" --jq .status 2>"$RUNNER_TEMP/compare.err")"; then
                if grep -q "HTTP 404" "$RUNNER_TEMP/compare.err"; then
                  status="missing"
                else
                  cat "$RUNNER_TEMP/compare.err"
                  echo "::error::Could not compare ${current:0:7} with ${SHA:0:7}; keeping the baseline."
                  exit 1
                fi
              fi
              if [[ "$status" != "ahead" && "$status" != "missing" ]]; then
                echo "Baseline ${current:0:7} is not older than ${SHA:0:7} (compare: ${status}); keeping it."
                exit 0
              fi
            fi
          elif ! grep -Eq "404|NoSuchKey|Not Found" "$RUNNER_TEMP/current.err"; then
            cat "$RUNNER_TEMP/current.err"
            echo "::error::Could not read the current baseline; not replacing it."
            exit 1
          fi
          aws s3 cp "$RUNNER_TEMP/gallery/manifest.json" "$uri" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json --cache-control "no-cache"
          echo "Main screenshot baseline is now ${SHA:0:7}."

      # Only the run for the current head moves the stable link, so a slow older run can't win.
      - name: Point the latest link at this gallery
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PR_SCREENSHOTS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PR_SCREENSHOTS_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ vars.PR_SCREENSHOTS_R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.PR_SCREENSHOTS_R2_BUCKET }}
          MODE: ${{ steps.run.outputs.mode }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_URL: ${{ steps.dest.outputs.base_url }}
          LATEST_KEY: ${{ steps.dest.outputs.latest_key }}
        run: |
          if [[ "$MODE" == "pr" ]]; then
            head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          else
            head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)"
          fi
          if [[ "$head" != "$SHA" ]]; then
            echo "Head moved to ${head:0:7}; leaving the latest link alone."
            exit 0
          fi
          node .github/scripts/pr-screenshots.mjs latest "$RUNNER_TEMP/latest.html" "${BASE_URL}/index.html"
          aws s3 cp "$RUNNER_TEMP/latest.html" "s3://${R2_BUCKET}/${LATEST_KEY}" --endpoint-url "$R2_ENDPOINT" \
            --content-type "text/html; charset=utf-8" --cache-control "no-cache"

      - name: Write job summary
        if: steps.dest.outputs.publish == 'true'
        env:
          GALLERY_BASE_URL: ${{ steps.upload.outcome == 'success' && steps.dest.outputs.base_url || '' }}
          LATEST_URL: ${{ steps.upload.outcome == 'success' && steps.dest.outputs.latest_url || '' }}
        run: node .github/scripts/pr-screenshots.mjs summary "$RUNNER_TEMP/gallery" >> "$GITHUB_STEP_SUMMARY"

      # Shows up as "Visual review" in the PR's checks list and on the commit, linking the gallery.
      - name: Set Visual review commit status
        if: steps.dest.outputs.publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GALLERY_BASE_URL: ${{ steps.upload.outcome == 'success' && steps.dest.outputs.base_url || '' }}
        run: |
          description="$(jq -r '
            [.shots[].status] as $s
            | ($s | map(select(. == "failed")) | length) as $failed
            | if .baseline then "\($s | map(select(. == "changed")) | length) changed · \($s | map(select(. == "new")) | length) new · \($failed) failed"
              else "\($s | length) screenshots · \($failed) failed" end' "$RUNNER_TEMP/gallery/shots.json")"
          state="success"
          [[ "$RESULT" == "success" ]] || state="failure"
          target="${GALLERY_BASE_URL:+${GALLERY_BASE_URL}/index.html}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$state" -f context="Visual review" -f description="${description:0:140}" \
            -f target_url="${target:-$RUN_URL}" > /dev/null

      - name: Comment on pull request
        if: steps.run.outputs.mode == 'pr' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GALLERY_BASE_URL: ${{ steps.upload.outcome == 'success' && steps.dest.outputs.base_url || '' }}
        run: |
          # A newer push may have landed while this run was publishing; leave the comment to its run.
          head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          if [[ "$head" != "$SHA" ]]; then
            echo "Pull request head moved to ${head}; not updating the comment for ${SHA}."
            exit 0
          fi
          body="$(node .github/scripts/pr-screenshots.mjs comment "$RUNNER_TEMP/gallery")"
          marker='<!-- supercheck-pr-screenshots -->'
          comment_id="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq -r --arg marker "$marker" '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))] | last | .id // empty')"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input - <<<"$payload" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - <<<"$payload" > /dev/null
          fi
