name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "app/public/openapi.json"
      - "app/src/lib/billing/plan-catalog.json"
      - "app/src/lib/billing/pricing-copy.ts"
      - "app/src/lib/billing/trial-copy.ts"
      - ".github/workflows/docs-deploy.yml"
  pull_request:
    # Any base: a PR stacked on another branch needs the docs build too. Deploy still runs only on main.
    branches: ["**"]
    paths:
      - "docs/**"
      - "app/public/openapi.json"
      - "app/src/lib/billing/plan-catalog.json"
      - "app/src/lib/billing/pricing-copy.ts"
      - "app/src/lib/billing/trial-copy.ts"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate Docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci --prefer-offline --no-audit

      - name: Test OpenAPI sync
        working-directory: docs
        run: npm run test:openapi

      - name: Check the pricing page trial copy comes from the plan catalog
        working-directory: docs
        run: npm run test:trial-docs

      - name: Build static site
        working-directory: docs
        run: npm run build

      - name: Verify rendered API pages
        working-directory: docs
        run: npm run test:rendered-api

      - name: Install Playwright Chromium
        working-directory: docs
        run: npx playwright install --with-deps chromium

      # Default build: no tools API configured, so pages show the methodology only.
      - name: Free tools pages (unconfigured)
        working-directory: docs
        run: npx playwright test -c e2e/playwright.config.ts

      # The checks API and Turnstile are mocked in the browser; these values are placeholders.
      - name: Free tools pages (configured)
        working-directory: docs
        env:
          NEXT_PUBLIC_CHECKS_API_URL: https://tools-api.test
          NEXT_PUBLIC_TOOLS_TURNSTILE_SITE_KEY: test-site-key
          E2E_TOOLS: configured
        run: npx next build && npx playwright test -c e2e/playwright.config.ts

  deploy-docs:
    name: Build and Deploy Docs
    # Production Pages content must always come from the reviewed default branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci --prefer-offline --no-audit

      # Public values for the free tools (separate Cloudflare account). Unset: tool pages show methodology only.
      - name: Build static site
        working-directory: docs
        env:
          NEXT_PUBLIC_CHECKS_API_URL: ${{ vars.TOOLS_API_URL }}
          NEXT_PUBLIC_TOOLS_TURNSTILE_SITE_KEY: ${{ vars.TOOLS_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: pages deploy out --project-name=supercheck --branch=main --commit-dirty=true
