name: Supercheck CLI

on:
  workflow_call:
    inputs:
      job-id:
        description: Job ID to trigger
        required: true
        type: string
      wait:
        description: Wait for the run to finish
        required: false
        type: boolean
        default: true
      timeout:
        description: Maximum wait time in seconds
        required: false
        type: number
        default: 300
      supercheck-url:
        description: Supercheck API URL for self-hosted installations
        required: false
        type: string
        default: ""
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "20"
      cli-version:
        description: Supercheck CLI npm tag or version
        required: false
        type: string
        default: latest
    secrets:
      SUPERCHECK_TRIGGER_KEY:
        description: Job trigger key (sck_trigger_* or job_*)
        required: true
      SUPERCHECK_TOKEN:
        description: CLI token required when wait is true
        required: false
    outputs:
      run-id:
        description: Triggered run ID
        value: ${{ jobs.supercheck.outputs.run-id }}
      status:
        description: Final run status when wait is true
        value: ${{ jobs.supercheck.outputs.status }}

permissions:
  contents: read

jobs:
  supercheck:
    name: Run Supercheck job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run-id: ${{ steps.trigger.outputs.run-id }}
      status: ${{ steps.trigger.outputs.status }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Supercheck CLI
        run: npm install --global "@supercheck/cli@${CLI_VERSION}"
        env:
          CLI_VERSION: ${{ inputs.cli-version }}

      - name: Validate wait credentials
        if: inputs.wait
        run: |
          if [ -z "$SUPERCHECK_TOKEN" ]; then
            echo "::error::SUPERCHECK_TOKEN is required when wait is true"
            exit 1
          fi
        env:
          SUPERCHECK_TOKEN: ${{ secrets.SUPERCHECK_TOKEN }}

      - name: Trigger job
        id: trigger
        shell: bash
        run: |
          args=("$JOB_ID")
          if [ "$WAIT_FOR_RESULT" = "true" ]; then
            args+=("--wait" "--timeout" "$WAIT_TIMEOUT")
          fi

          set +e
          output=$(supercheck --json job trigger "${args[@]}" 2>&1)
          exit_code=$?
          set -e

          echo "$output"

          run_id=$(printf '%s' "$output" | node -e '
            const input = require("fs").readFileSync(0, "utf8");
            try {
              const value = JSON.parse(input);
              process.stdout.write(String(value.runId || value.id || ""));
            } catch {
              const match = input.match(/Run ID:\s*([A-Za-z0-9_-]+)/);
              process.stdout.write(match?.[1] || "");
            }
          ')
          status=$(printf '%s' "$output" | node -e '
            const input = require("fs").readFileSync(0, "utf8");
            try {
              const value = JSON.parse(input);
              process.stdout.write(typeof value.status === "string" ? value.status : "");
            } catch {
              process.stdout.write("");
            }
          ')

          if [[ ! "$run_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
            run_id=""
          fi
          if [[ ! "$status" =~ ^[A-Za-z0-9_-]*$ ]]; then
            status=""
          fi

          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$exit_code"
        env:
          JOB_ID: ${{ inputs.job-id }}
          WAIT_FOR_RESULT: ${{ inputs.wait }}
          WAIT_TIMEOUT: ${{ inputs.timeout }}
          SUPERCHECK_URL: ${{ inputs.supercheck-url }}
          SUPERCHECK_TRIGGER_KEY: ${{ secrets.SUPERCHECK_TRIGGER_KEY }}
          SUPERCHECK_TOKEN: ${{ secrets.SUPERCHECK_TOKEN }}
