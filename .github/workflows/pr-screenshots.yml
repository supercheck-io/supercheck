name: PR Screenshots

# Boots a throwaway self-hosted Supercheck (Postgres + Redis, no worker) from the
# pull request's code, runs the screenshot tour in app/e2e/tests/screenshots, and
# uploads the PNGs. This job gets no secrets; publish-pr-screenshots.yml hosts the
# images and comments on the PR from trusted default-branch code.
# Runs on main (and on demand) too: a passing main run becomes the baseline that PR
# galleries compare against to label frames New or Changed.
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/pr-screenshots.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/pr-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; main runs queue so each can refresh the baseline.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  screenshots:
    name: PR Screenshots
    # Dependabot runs get a read-only token, so the publisher could not comment anyway.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: supercheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway self-hosted app: no email verification, billing or outbound mail.
      SELF_HOSTED: "true"
      SIGNUP_ENABLED: "true"
      DATABASE_URL: postgresql://postgres@localhost:5432/supercheck?sslmode=disable
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      STATUS_PAGE_DOMAIN: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            app/package-lock.json
            app/e2e/package-lock.json

      - name: Install app dependencies
        working-directory: ./app
        run: npm ci --prefer-offline --no-audit

      - name: Install E2E dependencies
        working-directory: ./app/e2e
        run: npm ci --prefer-offline --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('app/e2e/package-lock.json') }}
          restore-keys: playwright-

      - name: Install Chromium
        working-directory: ./app/e2e
        run: npx playwright install --with-deps chromium

      - name: Generate throwaway app secrets
        run: |
          auth_secret="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -hex 16)"
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$encryption_key"
          {
            echo "BETTER_AUTH_SECRET=$auth_secret"
            echo "SECRET_ENCRYPTION_KEY=$encryption_key"
          } >> "$GITHUB_ENV"

      - name: Migrate database
        working-directory: ./app
        run: npm run db:migrate

      - name: Build app
        working-directory: ./app
        run: npm run build:webpack
        env:
          SKIP_ENV_VALIDATION: true

      - name: Start app
        working-directory: ./app
        run: |
          nohup npx next start -p 3000 -H 127.0.0.1 > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::App did not become healthy"
          tail -100 "$RUNNER_TEMP/app.log"
          exit 1

      # Signs up the demo user and creates records through the app's API and UI, then adds
      # the run and check history only a worker would create (tests/screenshots/).
      - name: Seed demo data
        working-directory: ./app/e2e
        run: |
          npx playwright test --project=screenshots-setup
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/screenshots/seed-history.sql
        env:
          CI: true
          E2E_SCREENSHOTS: "1"
          E2E_BASE_URL: http://localhost:3000

      - name: Capture page tour and flows
        working-directory: ./app/e2e
        run: npx playwright test --project=screenshots --no-deps
        env:
          CI: true
          E2E_SCREENSHOTS: "1"
          E2E_BASE_URL: http://localhost:3000

      # The regular E2E suite against this throwaway app, signed in as the tour's demo user.
      # Every browser test leaves an end-of-test checkpoint (failed-… when it fails); see
      # app/e2e/fixtures/checkpoint.fixture.ts. Runs after the tour, which needs clean data.
      - name: Capture E2E checkpoints
        if: ${{ !cancelled() }}
        working-directory: ./app/e2e
        run: npx playwright test --project=chromium
        env:
          CI: true
          E2E_CHECKPOINTS: "1"
          E2E_BASE_URL: http://localhost:3000

      - name: Show app log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/app.log" || true

      # Only PNGs and their checkpoint sidecars leave this job: test-results can hold
      # traces or request bodies.
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-screenshots
          path: |
            app/e2e/test-results/**/*.png
            app/e2e/test-results/**/*.checkpoint.json
          retention-days: 7
          if-no-files-found: warn
