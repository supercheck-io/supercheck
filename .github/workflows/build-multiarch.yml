name: Build Multi-Architecture Docker Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Custom version tag (e.g. beta-1.0.0)"
        required: false
        type: string
      platforms:
        description: "Target platforms override (e.g. linux/amd64)"
        required: false
        type: string
      push_latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: supercheck-io/supercheck
  E2E_BASE_URL: https://demo.supercheck.dev

# Explicit permissions following least-privilege principle
# Individual jobs may override with elevated permissions (e.g., packages: write)
permissions:
  contents: read

# A newer release must not replace the demo while an older release is still
# running its exact-revision E2E suite.
concurrency:
  group: demo-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        package: [app, worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.package }}
        run: npm ci --prefer-offline --no-audit

      - name: Type check
        working-directory: ./${{ matrix.package }}
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ./${{ matrix.package }}
        run: |
          if [ "${{ matrix.package }}" = "app" ]; then
            npm run lint -- --max-warnings 0
          else
            npx eslint "src/**/*.ts"
          fi

      - name: Run tests
        working-directory: ./${{ matrix.package }}
        run: npm run test:cov -- --maxWorkers=2
        env:
          NODE_ENV: test

      - name: Build check
        working-directory: ./${{ matrix.package }}
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: ${{ matrix.package == 'app' && 'true' || 'false' }}

  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.app-meta.outputs.version }}
      app_digest: ${{ steps.build-app.outputs.digest }}
      worker_digest: ${{ steps.build-worker.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Clean up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          docker system df

          # Remove unnecessary tools and packages to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          # Clean up Docker system to reclaim space
          docker system prune -af --volumes

          echo "=== After cleanup ==="
          df -h
          docker system df

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check registry access
        env:
          CUSTOM_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_USER: ${{ github.actor }}
          PUSH_LATEST: ${{ github.event.inputs.push_latest }}
        run: |
          echo "Testing registry access..."
          echo "Registry: $REGISTRY"
          echo "Username: $EVENT_USER"
          echo "Repository: $EVENT_REPOSITORY"
          echo "Event: $EVENT_NAME"
          echo "Ref: $EVENT_REF"
          echo "Custom Version: $CUSTOM_VERSION"
          echo "Push Latest: $PUSH_LATEST"

      - name: Extract app metadata
        id: app-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app
          tags: |
            # Full version for releases (e.g. 1.2.3 or 1.2.3-canary.1)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Major.minor for stable releases only (e.g. 1.2)
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            # Custom version from manual workflow input
            type=raw,value=${{ github.event.inputs.version }},priority=800,enable=${{ github.event.inputs.version != '' }}
            # Latest tag ONLY for stable releases (no prerelease suffix like -canary, -beta, -alpha, -rc)
            type=raw,value=latest,priority=50,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            # Latest tag override for manual builds (use with caution)
            type=raw,value=latest,priority=50,enable=${{ github.event.inputs.push_latest == 'true' }}
            # Fallback tag using git SHA for manual builds without custom version
            type=sha,prefix={{branch}}-,suffix=-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version == '' }}

      - name: Extract worker metadata
        id: worker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker
          tags: |
            # Full version for releases (e.g. 1.2.3 or 1.2.3-canary.1)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Major.minor for stable releases only (e.g. 1.2)
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            # Custom version from manual workflow input
            type=raw,value=${{ github.event.inputs.version }},priority=800,enable=${{ github.event.inputs.version != '' }}
            # Latest tag ONLY for stable releases (no prerelease suffix like -canary, -beta, -alpha, -rc)
            type=raw,value=latest,priority=50,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            # Latest tag override for manual builds (use with caution)
            type=raw,value=latest,priority=50,enable=${{ github.event.inputs.push_latest == 'true' }}
            # Fallback tag using git SHA for manual builds without custom version
            type=sha,prefix={{branch}}-,suffix=-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version == '' }}

      - name: Validate deployable image metadata
        shell: bash
        env:
          APP_IMAGE_TAG: ${{ steps.app-meta.outputs.version }}
          WORKER_IMAGE_TAG: ${{ steps.worker-meta.outputs.version }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$APP_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Docker metadata did not produce a valid app image tag"
            exit 1
          fi
          if [[ "$APP_IMAGE_TAG" == "latest" ]]; then
            echo "::error::Use a version or generated SHA tag for deployment; latest is only an alias"
            exit 1
          fi
          if [[ "$WORKER_IMAGE_TAG" != "$APP_IMAGE_TAG" ]]; then
            echo "::error::App and worker metadata selected different deployment tags"
            exit 1
          fi

      - name: Build and push app image
        id: build-app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SOURCE_URL=https://github.com/supercheck-io/supercheck/tree/${{ github.sha }}
            SUPERCHECK_BUILD_SHA=${{ github.sha }}
          # Keep release correctness independent of the GitHub Actions cache
          # service. A failed GHA cache export used to fail this job after the
          # image manifest had already been pushed successfully.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:buildcache,mode=max,ignore-error=true

      - name: Clean up after app build
        run: |
          echo "=== Cleaning up after app build ==="
          docker system prune -af
          df -h

      - name: Build and push worker image
        id: build-worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:buildcache,mode=max,ignore-error=true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images
        env:
          APP_DIGEST: ${{ steps.build-app.outputs.digest }}
          WORKER_DIGEST: ${{ steps.build-worker.outputs.digest }}
        run: |
          cosign sign --yes "$REGISTRY/$IMAGE_NAME/app@$APP_DIGEST"
          cosign sign --yes "$REGISTRY/$IMAGE_NAME/worker@$WORKER_DIGEST"

      - name: Output image names
        env:
          APP_TAGS: ${{ steps.app-meta.outputs.tags }}
          WORKER_TAGS: ${{ steps.worker-meta.outputs.tags }}
        run: |
          echo "App image: $REGISTRY/$IMAGE_NAME/app"
          echo "Worker image: $REGISTRY/$IMAGE_NAME/worker"
          echo "App tags:"
          echo "$APP_TAGS"
          echo "Worker tags:"
          echo "$WORKER_TAGS"

  deploy-demo:
    name: Deploy Demo Environment
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: demo
    permissions:
      contents: read

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Configure verified SSH access
        shell: bash
        env:
          DEMO_HOST: ${{ secrets.DEMO_HOST }}
          DEMO_USER: ${{ secrets.DEMO_USER }}
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
          DEMO_SSH_PORT: ${{ vars.DEMO_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail

          for required_name in DEMO_HOST DEMO_USER DEMO_SSH_KEY DEMO_SSH_KNOWN_HOSTS; do
            if [ -z "${!required_name:-}" ]; then
              echo "::error::Missing required demo environment secret: ${required_name}"
              exit 1
            fi
          done

          if [[ ! "$DEMO_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]*$ ]]; then
            echo "::error::DEMO_HOST is invalid"
            exit 1
          fi
          if [[ ! "$DEMO_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
            echo "::error::DEMO_USER is invalid"
            exit 1
          fi
          if [[ ! "$DEMO_SSH_PORT" =~ ^[0-9]+$ ]] || (( DEMO_SSH_PORT < 1 || DEMO_SSH_PORT > 65535 )); then
            echo "::error::DEMO_SSH_PORT must be between 1 and 65535"
            exit 1
          fi

          install -d -m 700 "$RUNNER_TEMP/supercheck-demo-ssh"
          printf '%s\n' "$DEMO_SSH_KEY" >"$RUNNER_TEMP/supercheck-demo-ssh/id"
          printf '%s\n' "$DEMO_SSH_KNOWN_HOSTS" >"$RUNNER_TEMP/supercheck-demo-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/supercheck-demo-ssh/id" "$RUNNER_TEMP/supercheck-demo-ssh/known_hosts"

          ssh-keygen -y -f "$RUNNER_TEMP/supercheck-demo-ssh/id" >/dev/null
          ssh-keygen -l -f "$RUNNER_TEMP/supercheck-demo-ssh/known_hosts" >/dev/null

      - name: Deploy exact release to demo
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          APP_DIGEST: ${{ needs.build-and-push.outputs.app_digest }}
          WORKER_DIGEST: ${{ needs.build-and-push.outputs.worker_digest }}
          DEMO_HOST: ${{ secrets.DEMO_HOST }}
          DEMO_USER: ${{ secrets.DEMO_USER }}
          DEMO_SSH_PORT: ${{ vars.DEMO_SSH_PORT || '22' }}
          DEMO_DEPLOY_PATH: ${{ vars.DEMO_DEPLOY_PATH || '/root/supercheck/deploy/docker' }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ || "$IMAGE_TAG" == "latest" ]]; then
            echo "::error::Docker metadata produced an invalid deployment tag"
            exit 1
          fi
          if [[ ! "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || ! "$WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build outputs did not contain valid app and worker digests"
            exit 1
          fi

          printf -v REMOTE_ARGS '%q %q %q %q' \
            "$IMAGE_TAG" "$APP_DIGEST" "$WORKER_DIGEST" "$DEMO_DEPLOY_PATH"

          # Copy the script to a remote temp file, then execute it. Running via
          # `bash -s` with the script on SSH stdin lets docker/cli children
          # inherit that stream; a failed imagetools/digest step also surfaced
          # only as SSH exit 255 with no script diagnostics.
          ssh \
            -i "$RUNNER_TEMP/supercheck-demo-ssh/id" \
            -p "$DEMO_SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=2 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=3 \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/supercheck-demo-ssh/known_hosts" \
            "$DEMO_USER@$DEMO_HOST" \
            "set -Eeuo pipefail; script=\$(mktemp); trap 'rm -f -- \"\$script\"' EXIT; cat >\"\$script\"; chmod 700 \"\$script\"; bash \"\$script\" ${REMOTE_ARGS}" \
            <.github/scripts/deploy-demo.sh

      - name: Verify public demo revision
        shell: bash
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            if response="$(curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              "${E2E_BASE_URL}/api/health" 2>/dev/null)"; then
              revision="$(jq -r '.build.revision // empty' <<<"$response")"
              status="$(jq -r '.status // empty' <<<"$response")"
              database_status="$(jq -r '.checks.database.status // empty' <<<"$response")"
              if [[ "$revision" == "$EXPECTED_BUILD_SHA" && "$status" =~ ^(ok|degraded)$ && "$database_status" == "ok" ]]; then
                echo "Public demo is serving build ${EXPECTED_BUILD_SHA}"
                exit 0
              fi
            fi
            sleep 5
          done

          echo "::error::Public demo did not serve healthy build ${EXPECTED_BUILD_SHA} within five minutes"
          exit 1

      - name: Remove SSH credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/supercheck-demo-ssh/id" "$RUNNER_TEMP/supercheck-demo-ssh/known_hosts"

  e2e-tests:
    name: Full E2E Tests
    # The full suite runs only after the demo serves the triggering build SHA.
    needs: deploy-demo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Cache npm dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('app/e2e/package-lock.json') }}
          restore-keys: npm-e2e-

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('app/e2e/package-lock.json') }}
          restore-keys: playwright-

      - name: Install dependencies
        working-directory: ./app/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./app/e2e
        run: npx playwright install --with-deps chromium

      - name: Run full E2E test suite
        id: e2e-tests
        working-directory: ./app/e2e
        run: |
          REQUIRED_VARS="E2E_TEST_USER_EMAIL E2E_TEST_USER_PASSWORD E2E_INVITEE_EMAIL E2E_INVITEE_PASSWORD E2E_SESSION_USER_EMAIL E2E_SESSION_USER_PASSWORD E2E_SECURITY_USER_EMAIL E2E_SECURITY_USER_PASSWORD E2E_SUPER_ADMIN_EMAIL E2E_SUPER_ADMIN_PASSWORD E2E_ORG_OWNER_EMAIL E2E_ORG_OWNER_PASSWORD E2E_ORG_ADMIN_EMAIL E2E_ORG_ADMIN_PASSWORD E2E_PROJECT_ADMIN_EMAIL E2E_PROJECT_ADMIN_PASSWORD E2E_EDITOR_EMAIL E2E_EDITOR_PASSWORD E2E_VIEWER_EMAIL E2E_VIEWER_PASSWORD"
          MISSING_VARS=""
          for VAR_NAME in $REQUIRED_VARS; do
            if [ -z "$(printenv "$VAR_NAME")" ]; then
              MISSING_VARS="$MISSING_VARS $VAR_NAME"
            fi
          done
          if [ -n "$MISSING_VARS" ]; then
            echo "::error::Missing required full-suite E2E variables:$MISSING_VARS"
            exit 1
          fi

          npx playwright test
        timeout-minutes: 50
        continue-on-error: true
        env:
          CI: true
          E2E_FAIL_ON_PRIORITY_SKIPS: true
          E2E_EXPECTED_BUILD_SHA: ${{ github.sha }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_INVITEE_EMAIL: ${{ secrets.E2E_INVITEE_EMAIL }}
          E2E_INVITEE_PASSWORD: ${{ secrets.E2E_INVITEE_PASSWORD }}
          E2E_SESSION_USER_EMAIL: ${{ secrets.E2E_SESSION_USER_EMAIL }}
          E2E_SESSION_USER_PASSWORD: ${{ secrets.E2E_SESSION_USER_PASSWORD }}
          E2E_SECURITY_USER_EMAIL: ${{ secrets.E2E_SECURITY_USER_EMAIL }}
          E2E_SECURITY_USER_PASSWORD: ${{ secrets.E2E_SECURITY_USER_PASSWORD }}
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
          E2E_ORG_OWNER_EMAIL: ${{ secrets.E2E_ORG_OWNER_EMAIL }}
          E2E_ORG_OWNER_PASSWORD: ${{ secrets.E2E_ORG_OWNER_PASSWORD }}
          E2E_ORG_ADMIN_EMAIL: ${{ secrets.E2E_ORG_ADMIN_EMAIL }}
          E2E_ORG_ADMIN_PASSWORD: ${{ secrets.E2E_ORG_ADMIN_PASSWORD }}
          E2E_PROJECT_ADMIN_EMAIL: ${{ secrets.E2E_PROJECT_ADMIN_EMAIL }}
          E2E_PROJECT_ADMIN_PASSWORD: ${{ secrets.E2E_PROJECT_ADMIN_PASSWORD }}
          E2E_EDITOR_EMAIL: ${{ secrets.E2E_EDITOR_EMAIL }}
          E2E_EDITOR_PASSWORD: ${{ secrets.E2E_EDITOR_PASSWORD }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report-full
          path: app/e2e/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-full
          path: app/e2e/test-results/
          retention-days: 14

      - name: Create test summary
        if: always()
        run: |
          echo "## 🎭 Full E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "app/e2e/test-results/results.json" ]; then
            PASSED=$(jq '.stats.expected // 0' app/e2e/test-results/results.json)
            FAILED=$(jq '.stats.unexpected // 0' app/e2e/test-results/results.json)
            SKIPPED=$(jq '.stats.skipped // 0' app/e2e/test-results/results.json)
            DURATION_MIN=$(jq '((.stats.duration // 0) / 60000) | floor' app/e2e/test-results/results.json)

            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${DURATION_MIN}m |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "${{ steps.e2e-tests.outcome }}" == "failure" ]; then
              echo "> ⚠️ **Some tests failed.** Download the playwright-report-full artifact for details." >> $GITHUB_STEP_SUMMARY
            else
              echo "> ✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No test results found. Tests may have failed to start or timed out." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if tests failed
        if: steps.e2e-tests.outcome == 'failure'
        run: |
          echo "::error::E2E tests failed. Check the playwright-report-full artifact for details."
          exit 1
