name: Build Multi-Architecture Docker Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Custom version tag (e.g. beta-1.0.0)"
        required: false
        type: string
      platforms:
        description: "Target platforms override (e.g. linux/amd64)"
        required: false
        type: string
      push_latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: supercheck-io/supercheck

# Explicit permissions following least-privilege principle
# Individual jobs may override with elevated permissions (e.g., packages: write)
permissions:
  contents: read

# Releases run one at a time, so an older release's Compose E2E is never cut short.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-release-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Release tags must be annotated and signed by a key listed in
      # main's .github/release-allowed-signers. The signers file is read
      # from main, not from the tagged commit, so a tag cannot add its own key.
      - name: Checkout release signers from main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: release-signers
          sparse-checkout: .github/release-allowed-signers
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Require signed annotated release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # actions/checkout fetches the tag as a bare commit
          # (+<sha>:refs/tags/<tag>), overwriting the annotated tag object.
          # Re-fetch the real tag object before verifying it.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "::error::Tag $RELEASE_TAG is lightweight or missing. Release tags must be annotated and signed."
            exit 1
          fi
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/release-signers/.github/release-allowed-signers" \
            verify-tag "refs/tags/$RELEASE_TAG"
          # The verified tag must still point at the commit this run builds.
          if [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG no longer points at $GITHUB_SHA."
            exit 1
          fi

      # The release tag is the single source of truth for the version baked
      # into the images. Stable tags must also match every other version
      # location, so npm metadata, image identity, and the self-hosted Compose
      # defaults cannot drift. Prerelease tags (for example v1.3.7-rc.1) are cut
      # before the version bump and are intentionally exempt. This job always
      # runs and no-ops for non-tag/manual runs so dependent jobs are never
      # cascade-skipped.
      - name: Require stable tag to match all version locations
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          if [[ "$RELEASE_REF" != refs/tags/v* ]]; then
            echo "Ref '$RELEASE_REF' is not a version tag; skipping version match."
            exit 0
          fi
          tag="${RELEASE_REF#refs/tags/v}"
          if [[ "$tag" == *-* ]]; then
            echo "Prerelease tag '$tag' detected; skipping version match."
            exit 0
          fi

          app_version=$(node -p "require('./app/package.json').version")
          worker_version=$(node -p "require('./worker/package.json').version")
          if [[ "$app_version" != "$tag" || "$worker_version" != "$tag" ]]; then
            echo "::error::Stable tag v$tag must match app package.json ($app_version) and worker package.json ($worker_version)."
            exit 1
          fi

          compose_default_count=0
          while IFS= read -r compose_default; do
            [[ -n "$compose_default" ]] || continue
            compose_default_count=$((compose_default_count + 1))
            if [[ "$compose_default" != "$tag" ]]; then
              echo "::error::deploy/docker compose default '$compose_default' must match release tag v$tag."
              exit 1
            fi
          done < <(
            grep -rhoE '\$\{SUPERCHECK_VERSION:-[0-9A-Za-z._-]+' deploy/docker/*.yml \
              | sed 's/.*:-//' \
              | sort -u
          )
          if [[ "$compose_default_count" -eq 0 ]]; then
            echo "::error::No SUPERCHECK_VERSION defaults found in deploy/docker compose files."
            exit 1
          fi
          echo "Release tag v$tag matches package.json and deploy/docker compose defaults."

  # Shared with the manual Release Certification workflow so the release gate
  # (production dependency audit, disposable PostgreSQL 18, coverage gates)
  # cannot drift from what maintainers run by hand.
  test:
    name: Release Certification
    permissions:
      contents: read
    uses: ./.github/workflows/release-certification.yml

  build-and-push:
    name: Build and Push Docker Images
    needs: [test, validate-release-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.app-meta.outputs.version }}
      app_digest: ${{ steps.build-app.outputs.digest }}
      worker_digest: ${{ steps.build-worker.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Clean up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          docker system df

          # Remove unnecessary tools and packages to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          # Clean up Docker system to reclaim space
          docker system prune -af --volumes

          echo "=== After cleanup ==="
          df -h
          docker system df

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app metadata
        id: app-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app
          # metadata-action adds latest for stable semver tags unless disabled.
          flavor: latest=false
          # Only immutable tags are pushed here. Floating tags (major.minor, latest) are
          # promoted by promote-floating-tags after compose-e2e passes.
          tags: |
            # Full version for releases (e.g. 1.2.3 or 1.2.3-canary.1)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Custom version from manual workflow input
            type=raw,value=${{ github.event.inputs.version }},priority=800,enable=${{ github.event.inputs.version != '' }}
            # Fallback tag using git SHA for manual builds without custom version
            type=sha,prefix={{branch}}-,suffix=-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version == '' }}

      - name: Extract worker metadata
        id: worker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker
          flavor: latest=false
          # Only immutable tags are pushed here. Floating tags (major.minor, latest) are
          # promoted by promote-floating-tags after compose-e2e passes.
          tags: |
            # Full version for releases (e.g. 1.2.3 or 1.2.3-canary.1)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Custom version from manual workflow input
            type=raw,value=${{ github.event.inputs.version }},priority=800,enable=${{ github.event.inputs.version != '' }}
            # Fallback tag using git SHA for manual builds without custom version
            type=sha,prefix={{branch}}-,suffix=-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version == '' }}

      - name: Validate deployable image metadata
        shell: bash
        env:
          APP_IMAGE_TAG: ${{ steps.app-meta.outputs.version }}
          WORKER_IMAGE_TAG: ${{ steps.worker-meta.outputs.version }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$APP_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Docker metadata did not produce a valid app image tag"
            exit 1
          fi
          if [[ "$APP_IMAGE_TAG" == "latest" ]]; then
            echo "::error::Use a version or generated SHA tag for deployment; latest is only an alias"
            exit 1
          fi
          if [[ "$WORKER_IMAGE_TAG" != "$APP_IMAGE_TAG" ]]; then
            echo "::error::App and worker metadata selected different deployment tags"
            exit 1
          fi

      - name: Build and push app image
        id: build-app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SOURCE_URL=https://github.com/supercheck-io/supercheck/tree/${{ github.sha }}
            NEXT_PUBLIC_SUPERCHECK_VERSION=${{ steps.app-meta.outputs.version }}
            SUPERCHECK_BUILD_SHA=${{ github.sha }}
            SENTRY_SOURCEMAPS=${{ secrets.SENTRY_AUTH_TOKEN != '' && '1' || '0' }}
            SENTRY_UPLOAD_ATTEMPT=${{ github.run_id }}-${{ github.run_attempt }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # BuildKit secret: readable only inside the source map upload RUN, never stored in a layer.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          # Keep release correctness independent of the GitHub Actions cache
          # service. A failed GHA cache export used to fail this job after the
          # image manifest had already been pushed successfully.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:buildcache,mode=max,ignore-error=true

      - name: Clean up after app build
        run: |
          echo "=== Cleaning up after app build ==="
          docker system prune -af
          df -h

      - name: Build and push worker image
        id: build-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./worker
          file: ./worker/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          build-args: |
            SUPERCHECK_VERSION=${{ steps.worker-meta.outputs.version }}
            SENTRY_SOURCEMAPS=${{ secrets.SENTRY_AUTH_TOKEN != '' && '1' || '0' }}
            SENTRY_UPLOAD_ATTEMPT=${{ github.run_id }}-${{ github.run_attempt }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:buildcache,mode=max,ignore-error=true

      # Agent tests import @supercheck/agent-test from this image (execution pods run it too), and the
      # worker only reports the agent-test capability when it resolves. Runs the pushed digest for the
      # runner's own platform; a failure stops the release before it is signed and deployed.
      - name: Smoke test worker image (agent-test package)
        env:
          WORKER_DIGEST: ${{ steps.build-worker.outputs.digest }}
        run: |
          docker run --rm "$REGISTRY/$IMAGE_NAME/worker@$WORKER_DIGEST" \
            node -e "require('@supercheck/agent-test')"

      # Associates commits and finalizes the Sentry release that the image builds
      # uploaded source maps to. Skipped without a token; never blocks a release.
      - name: Finalize Sentry release
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          RELEASE: ${{ steps.app-meta.outputs.version }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set; skipping Sentry release"
            exit 0
          fi
          npx --yes @sentry/cli@3.8.2 releases new "$RELEASE"
          npx --yes @sentry/cli@3.8.2 releases set-commits "$RELEASE" --auto --ignore-missing
          npx --yes @sentry/cli@3.8.2 releases finalize "$RELEASE"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images
        env:
          APP_DIGEST: ${{ steps.build-app.outputs.digest }}
          WORKER_DIGEST: ${{ steps.build-worker.outputs.digest }}
        run: |
          cosign sign --yes "$REGISTRY/$IMAGE_NAME/app@$APP_DIGEST"
          cosign sign --yes "$REGISTRY/$IMAGE_NAME/worker@$WORKER_DIGEST"

      - name: Write summary
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ steps.app-meta.outputs.version }}
          APP_DIGEST: ${{ steps.build-app.outputs.digest }}
          WORKER_DIGEST: ${{ steps.build-worker.outputs.digest }}
          APP_TAGS: ${{ steps.app-meta.outputs.tags }}
        run: |
          {
            echo "## Images for \`$IMAGE_TAG\` (signed)"
            echo ""
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| [\`$REGISTRY/$IMAGE_NAME/app\`](https://github.com/$GITHUB_REPOSITORY/pkgs/container/supercheck%2Fapp) | \`$APP_DIGEST\` |"
            echo "| [\`$REGISTRY/$IMAGE_NAME/worker\`](https://github.com/$GITHUB_REPOSITORY/pkgs/container/supercheck%2Fworker) | \`$WORKER_DIGEST\` |"
            echo ""
            tags=""
            while IFS= read -r tag; do [ -n "$tag" ] && tags+=" \`${tag##*:}\`"; done <<<"$APP_TAGS"
            echo "**Tags:**$tags"
            echo ""
            echo "Verify a signature:"
            echo ""
            echo '```sh'
            echo "cosign verify $REGISTRY/$IMAGE_NAME/app@$APP_DIGEST \\"
            echo "  --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # Release gate, part 1: the immutable-tag app image in the self-hosted Compose stack,
  # full suite. Part 2 is the full E2E run against staging (e2e-full.yml, target=staging),
  # started by hand after the staging deploy. Runs for tags and manual builds alike.
  compose-e2e:
    name: Self-hosted Compose E2E
    needs: build-and-push
    # The runner is amd64: an arm64-only manual build cannot be pulled, so it skips the gate
    # (and the promotion that depends on it).
    if: ${{ github.event.inputs.platforms == '' || contains(github.event.inputs.platforms, 'linux/amd64') }}
    permissions:
      contents: read
    uses: ./.github/workflows/compose-e2e.yml
    with:
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      full: true

  # Floating tags move only after the gate passes. imagetools create re-points the tag at the
  # already signed digests, so the multi-arch manifests are unchanged.
  promote-floating-tags:
    name: Promote floating tags
    needs: [build-and-push, compose-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Extract app floating tags
        id: app-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app
          tags: |
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || github.event.inputs.push_latest == 'true' }}

      - name: Extract worker floating tags
        id: worker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker
          tags: |
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || github.event.inputs.push_latest == 'true' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Promote tags to the gated digests
        env:
          APP_DIGEST: ${{ needs.build-and-push.outputs.app_digest }}
          WORKER_DIGEST: ${{ needs.build-and-push.outputs.worker_digest }}
          APP_TAGS: ${{ steps.app-meta.outputs.tags }}
          WORKER_TAGS: ${{ steps.worker-meta.outputs.tags }}
        run: |
          set -Eeuo pipefail
          promote() { # image digest tags
            local image="$1" digest="$2" tags="$3" args=() tag
            while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<<"$tags"
            [ "${#args[@]}" -gt 0 ] || { echo "No floating tags for $image"; return 0; }
            docker buildx imagetools create "${args[@]}" "$image@$digest"
          }
          promote "$REGISTRY/$IMAGE_NAME/app" "$APP_DIGEST" "$APP_TAGS"
          promote "$REGISTRY/$IMAGE_NAME/worker" "$WORKER_DIGEST" "$WORKER_TAGS"
