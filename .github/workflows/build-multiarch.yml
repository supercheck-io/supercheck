name: Build Multi-Architecture Docker Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Custom version tag (e.g. beta-1.0.0)"
        required: false
        type: string
      platforms:
        description: "Target platforms override (e.g. linux/amd64)"
        required: false
        type: string
      push_latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: supercheck-io/supercheck

# Explicit permissions following least-privilege principle
# Individual jobs may override with elevated permissions (e.g., packages: write)
permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        package: [app, worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.package }}
        run: npm ci --prefer-offline --no-audit

      - name: Type check
        working-directory: ./${{ matrix.package }}
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ./${{ matrix.package }}
        run: |
          if [ "${{ matrix.package }}" = "app" ]; then
            npm run lint -- --max-warnings 0
          else
            npx eslint "src/**/*.ts"
          fi

      - name: Run tests
        working-directory: ./${{ matrix.package }}
        run: npm run test:cov -- --maxWorkers=2
        env:
          NODE_ENV: test

      - name: Build check
        working-directory: ./${{ matrix.package }}
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: ${{ matrix.package == 'app' && 'true' || 'false' }}

  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clean up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          docker system df

          # Remove unnecessary tools and packages to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          # Clean up Docker system to reclaim space
          docker system prune -af --volumes

          # Clean up npm cache
          npm cache clean --force || true

          # Clean up temp directories
          rm -rf /tmp/* || true
          rm -rf /var/tmp/* || true

          # Clean up GitHub Actions cache
          rm -rf /home/runner/actions-runner/cached/_diag/* || true

          echo "=== After cleanup ==="
          df -h
          docker system df

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check registry access
        run: |
          echo "Testing registry access..."
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Username: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Custom Version: ${{ github.event.inputs.version }}"
          echo "Push Latest: ${{ github.event.inputs.push_latest }}"

      - name: Extract app metadata
        id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app
          tags: |
            # Full version for releases (e.g. 1.2.3 or 1.2.3-canary.1)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Major.minor for stable releases only (e.g. 1.2)
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            # Custom version from manual workflow input
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            # Latest tag ONLY for stable releases (no prerelease suffix like -canary, -beta, -alpha, -rc)
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-canary') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-rc') }}
            # Latest tag override for manual builds (use with caution)
            type=raw,value=latest,enable=${{ github.event.inputs.push_latest == 'true' }}
            # Fallback tag using git SHA for manual builds without custom version
            type=sha,prefix={{branch}}-,suffix=-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version == '' }}

      - name: Extract worker metadata
        id: worker-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker
          tags: |
            # Full version for releases (e.g. 1.2.3 or 1.2.3-canary.1)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Major.minor for stable releases only (e.g. 1.2)
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            # Custom version from manual workflow input
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            # Latest tag ONLY for stable releases (no prerelease suffix like -canary, -beta, -alpha, -rc)
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-canary') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-rc') }}
            # Latest tag override for manual builds (use with caution)
            type=raw,value=latest,enable=${{ github.event.inputs.push_latest == 'true' }}
            # Fallback tag using git SHA for manual builds without custom version
            type=sha,prefix={{branch}}-,suffix=-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version == '' }}

      - name: Build and push app image
        id: build-app
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SOURCE_URL=https://github.com/supercheck-io/supercheck/tree/${{ github.sha }}
            SUPERCHECK_BUILD_SHA=${{ github.sha }}
          # Keep release correctness independent of the GitHub Actions cache
          # service. A failed GHA cache export used to fail this job after the
          # image manifest had already been pushed successfully.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app:buildcache,mode=max,ignore-error=true

      - name: Clean up after app build
        run: |
          echo "=== Cleaning up after app build ==="
          docker system prune -af
          df -h

      - name: Build and push worker image
        id: build-worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:buildcache,mode=max,ignore-error=true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app@${{ steps.build-app.outputs.digest }}"
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker@${{ steps.build-worker.outputs.digest }}"

      - name: Output image names
        run: |
          echo "App image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/app"
          echo "Worker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker"
          echo "App tags:"
          echo "${{ steps.app-meta.outputs.tags }}"
          echo "Worker tags:"
          echo "${{ steps.worker-meta.outputs.tags }}"

  e2e-tests:
    name: Full E2E Tests
    # The full suite mutates projects, users, monitors, and other test data.
    # Enable this only after the built SHA is deployed to the isolated E2E
    # environment; production Turnstile intentionally blocks automation.
    if: ${{ vars.E2E_RELEASE_GATE_ENABLED == 'true' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('app/e2e/package-lock.json') }}
          restore-keys: npm-e2e-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('app/e2e/package-lock.json') }}
          restore-keys: playwright-

      - name: Install dependencies
        working-directory: ./app/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./app/e2e
        run: npx playwright install --with-deps chromium

      - name: Run full E2E test suite
        id: e2e-tests
        working-directory: ./app/e2e
        run: |
          REQUIRED_VARS="E2E_BASE_URL E2E_EXPECTED_BUILD_SHA E2E_TEST_USER_EMAIL E2E_TEST_USER_PASSWORD E2E_INVITEE_EMAIL E2E_INVITEE_PASSWORD E2E_SESSION_USER_EMAIL E2E_SESSION_USER_PASSWORD E2E_SECURITY_USER_EMAIL E2E_SECURITY_USER_PASSWORD E2E_SUPER_ADMIN_EMAIL E2E_SUPER_ADMIN_PASSWORD E2E_ORG_OWNER_EMAIL E2E_ORG_OWNER_PASSWORD E2E_ORG_ADMIN_EMAIL E2E_ORG_ADMIN_PASSWORD E2E_PROJECT_ADMIN_EMAIL E2E_PROJECT_ADMIN_PASSWORD E2E_EDITOR_EMAIL E2E_EDITOR_PASSWORD E2E_VIEWER_EMAIL E2E_VIEWER_PASSWORD"
          MISSING_VARS=""
          for VAR_NAME in $REQUIRED_VARS; do
            if [ -z "$(printenv "$VAR_NAME")" ]; then
              MISSING_VARS="$MISSING_VARS $VAR_NAME"
            fi
          done
          if [ -n "$MISSING_VARS" ]; then
            echo "::error::Missing required full-suite E2E variables:$MISSING_VARS"
            exit 1
          fi

          npx playwright test
        timeout-minutes: 50
        continue-on-error: true
        env:
          CI: true
          E2E_FAIL_ON_PRIORITY_SKIPS: true
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EXPECTED_BUILD_SHA: ${{ github.sha }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_INVITEE_EMAIL: ${{ secrets.E2E_INVITEE_EMAIL }}
          E2E_INVITEE_PASSWORD: ${{ secrets.E2E_INVITEE_PASSWORD }}
          E2E_SESSION_USER_EMAIL: ${{ secrets.E2E_SESSION_USER_EMAIL }}
          E2E_SESSION_USER_PASSWORD: ${{ secrets.E2E_SESSION_USER_PASSWORD }}
          E2E_SECURITY_USER_EMAIL: ${{ secrets.E2E_SECURITY_USER_EMAIL }}
          E2E_SECURITY_USER_PASSWORD: ${{ secrets.E2E_SECURITY_USER_PASSWORD }}
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
          E2E_ORG_OWNER_EMAIL: ${{ secrets.E2E_ORG_OWNER_EMAIL }}
          E2E_ORG_OWNER_PASSWORD: ${{ secrets.E2E_ORG_OWNER_PASSWORD }}
          E2E_ORG_ADMIN_EMAIL: ${{ secrets.E2E_ORG_ADMIN_EMAIL }}
          E2E_ORG_ADMIN_PASSWORD: ${{ secrets.E2E_ORG_ADMIN_PASSWORD }}
          E2E_PROJECT_ADMIN_EMAIL: ${{ secrets.E2E_PROJECT_ADMIN_EMAIL }}
          E2E_PROJECT_ADMIN_PASSWORD: ${{ secrets.E2E_PROJECT_ADMIN_PASSWORD }}
          E2E_EDITOR_EMAIL: ${{ secrets.E2E_EDITOR_EMAIL }}
          E2E_EDITOR_PASSWORD: ${{ secrets.E2E_EDITOR_PASSWORD }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-full
          path: app/e2e/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-full
          path: app/e2e/test-results/
          retention-days: 14

      - name: Create test summary
        if: always()
        run: |
          echo "## 🎭 Full E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "app/e2e/test-results/results.json" ]; then
            PASSED=$(jq '.stats.expected // 0' app/e2e/test-results/results.json)
            FAILED=$(jq '.stats.unexpected // 0' app/e2e/test-results/results.json)
            SKIPPED=$(jq '.stats.skipped // 0' app/e2e/test-results/results.json)
            DURATION_MIN=$(jq '((.stats.duration // 0) / 60000) | floor' app/e2e/test-results/results.json)

            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${DURATION_MIN}m |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "${{ steps.e2e-tests.outcome }}" == "failure" ]; then
              echo "> ⚠️ **Some tests failed.** Download the playwright-report-full artifact for details." >> $GITHUB_STEP_SUMMARY
            else
              echo "> ✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No test results found. Tests may have failed to start or timed out." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if tests failed
        if: steps.e2e-tests.outcome == 'failure'
        run: |
          echo "::error::E2E tests failed. Check the playwright-report-full artifact for details."
          exit 1
