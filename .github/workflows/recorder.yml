name: Recorder

on:
  push:
    branches: [main]
    paths:
      - "recorder/**"
      - ".github/workflows/recorder.yml"
  pull_request:
    paths:
      - "recorder/**"
      - ".github/workflows/recorder.yml"
  # The full browser suite is slow and currently flaky in CI, so it is not run
  # on every change. It runs on a schedule and on demand; the fast `validate`
  # job (build + unit tests) runs on pull requests and pushes instead.
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recorder-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: recorder

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: recorder/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build recorder and extension
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run unit tests
        run: npm run test:unit

  browser-tests:
    name: Browser Tests
    # Only on the weekly schedule or manual dispatch, never on pull requests.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: recorder/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build recorder and extension
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Install Chromium
        run: npm run test:install

      - name: Run browser tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npm run test:browser

      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recorder-playwright-report
          path: |
            recorder/tests/playwright-report/
            recorder/tests/test-results/
          if-no-files-found: ignore
          retention-days: 5
