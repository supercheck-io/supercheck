name: Full E2E Test Suite

on:
  # No schedule: each run sends real invitation emails from the target deployment.
  # Run it by hand after the staging deploy; this workflow never deploys.
  # Release gate: it must pass before the release is announced.
  workflow_dispatch:
    inputs:
      target:
        description: "staging reads the URL from the E2E_STAGING_BASE_URL secret; custom uses base_url"
        required: true
        default: staging
        type: choice
        options: [staging, custom]
      base_url:
        description: "Custom target URL (target=custom only; never the staging URL)"
        required: false
        type: string
      test_filter:
        description: "Test filter (e.g., @auth, @monitors, leave empty for all)"
        required: false
        type: string
      expected_build_sha:
        description: "Optional full SHA for deployment attestation"
        required: false
        type: string

env:
  NODE_VERSION: "24"

# Explicit permissions following least-privilege principle
permissions:
  contents: read
  actions: read

jobs:
  e2e-full:
    name: Full E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Serialize shared test identities, including callers using URL aliases.
    concurrency:
      group: supercheck-e2e
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('app/e2e/package-lock.json') }}
          restore-keys: npm-e2e-

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('app/e2e/package-lock.json') }}
          restore-keys: playwright-

      - name: Install dependencies
        working-directory: ./app/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./app/e2e
        run: npx playwright install --with-deps chromium

      # The staging hostname must never reach public logs or artifacts: it comes from a
      # secret and is masked before any other step can print it.
      - name: Resolve and mask target URL
        env:
          TARGET: ${{ inputs.target }}
          CUSTOM_URL: ${{ inputs.base_url }}
          STAGING_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
        run: |
          set -Eeuo pipefail
          if [ -n "$STAGING_URL" ]; then
            echo "::add-mask::$STAGING_URL"
            echo "::add-mask::$(node -e 'process.stdout.write(new URL(process.argv[1]).host)' "$STAGING_URL")"
          fi
          if [ "$TARGET" = "staging" ]; then
            [ -n "$STAGING_URL" ] || { echo "::error::Repository secret E2E_STAGING_BASE_URL is not set"; exit 1; }
            url="$STAGING_URL"
          else
            url="$CUSTOM_URL"
            [ -n "$url" ] || { echo "::error::target=custom needs base_url"; exit 1; }
            if [ -n "$STAGING_URL" ] && [ "${url%/}" = "${STAGING_URL%/}" ]; then
              echo "::error::Use target=staging for the staging deployment"
              exit 1
            fi
          fi
          echo "::add-mask::$url"
          echo "E2E_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "E2E_SANITIZE_URL=$STAGING_URL" >> "$GITHUB_ENV"

      - name: Run full E2E test suite
        id: e2e-tests
        working-directory: ./app/e2e
        run: |
          REQUIRED_VARS="E2E_TEST_USER_EMAIL E2E_TEST_USER_PASSWORD E2E_INVITEE_EMAIL E2E_INVITEE_PASSWORD E2E_SESSION_USER_EMAIL E2E_SESSION_USER_PASSWORD E2E_SECURITY_USER_EMAIL E2E_SECURITY_USER_PASSWORD E2E_SUPER_ADMIN_EMAIL E2E_SUPER_ADMIN_PASSWORD E2E_ORG_OWNER_EMAIL E2E_ORG_OWNER_PASSWORD E2E_ORG_ADMIN_EMAIL E2E_ORG_ADMIN_PASSWORD E2E_PROJECT_ADMIN_EMAIL E2E_PROJECT_ADMIN_PASSWORD E2E_EDITOR_EMAIL E2E_EDITOR_PASSWORD E2E_VIEWER_EMAIL E2E_VIEWER_PASSWORD"
          MISSING_VARS=""
          for VAR_NAME in $REQUIRED_VARS; do
            if [ -z "$(printenv "$VAR_NAME")" ]; then
              MISSING_VARS="$MISSING_VARS $VAR_NAME"
            fi
          done
          if [ -n "$MISSING_VARS" ]; then
            echo "::error::Missing required full-suite E2E variables:$MISSING_VARS"
            exit 1
          fi

          if [ -n "$TEST_FILTER" ]; then
            npx playwright test --grep "$TEST_FILTER"
          else
            npx playwright test
          fi
        timeout-minutes: 50
        env:
          CI: true
          E2E_FAIL_ON_PRIORITY_SKIPS: true
          TEST_FILTER: ${{ inputs.test_filter }}
          # When omitted, the conditional revision-attestation test is not
          # registered. Functional E2E coverage still runs in full.
          E2E_EXPECTED_BUILD_SHA: ${{ inputs.expected_build_sha }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_INVITEE_EMAIL: ${{ secrets.E2E_INVITEE_EMAIL }}
          E2E_INVITEE_PASSWORD: ${{ secrets.E2E_INVITEE_PASSWORD }}
          E2E_SESSION_USER_EMAIL: ${{ secrets.E2E_SESSION_USER_EMAIL }}
          E2E_SESSION_USER_PASSWORD: ${{ secrets.E2E_SESSION_USER_PASSWORD }}
          E2E_SECURITY_USER_EMAIL: ${{ secrets.E2E_SECURITY_USER_EMAIL }}
          E2E_SECURITY_USER_PASSWORD: ${{ secrets.E2E_SECURITY_USER_PASSWORD }}
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
          E2E_ORG_OWNER_EMAIL: ${{ secrets.E2E_ORG_OWNER_EMAIL }}
          E2E_ORG_OWNER_PASSWORD: ${{ secrets.E2E_ORG_OWNER_PASSWORD }}
          E2E_ORG_ADMIN_EMAIL: ${{ secrets.E2E_ORG_ADMIN_EMAIL }}
          E2E_ORG_ADMIN_PASSWORD: ${{ secrets.E2E_ORG_ADMIN_PASSWORD }}
          E2E_PROJECT_ADMIN_EMAIL: ${{ secrets.E2E_PROJECT_ADMIN_EMAIL }}
          E2E_PROJECT_ADMIN_PASSWORD: ${{ secrets.E2E_PROJECT_ADMIN_PASSWORD }}
          E2E_EDITOR_EMAIL: ${{ secrets.E2E_EDITOR_EMAIL }}
          E2E_EDITOR_PASSWORD: ${{ secrets.E2E_EDITOR_PASSWORD }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}

      # Only the rendered HTML report is published. The raw test-results/
      # directory is intentionally never uploaded: it can contain request
      # bodies and other attachments that must not leak with E2E credentials,
      # and traces are disabled in app/e2e/playwright.config.ts for the same
      # reason.
      - name: Upload Playwright report
        id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        # The HTML report embeds URLs from navigations and error context, so staging
        # runs publish only the sanitized summary below.
        if: ${{ always() && inputs.target != 'staging' }}
        with:
          name: playwright-report-full
          path: app/e2e/playwright-report/
          retention-days: 30

      - name: Write sanitized summary (staging)
        if: ${{ always() && inputs.target == 'staging' }}
        run: |
          f=app/e2e/test-results/results.json
          mkdir -p sanitized
          {
            if [ -s "$f" ]; then
              jq -r '"passed=\(.stats.expected // 0) failed=\(.stats.unexpected // 0) skipped=\(.stats.skipped // 0) flaky=\(.stats.flaky // 0)",
                     (.. | objects | select(has("specs")) | .specs[] | "\(if .ok then "pass" else "FAIL" end) \(.title)")' "$f"
            else
              echo "no results"
            fi
          } | HOST="$E2E_SANITIZE_URL" python3 -c '
          import os, sys
          from urllib.parse import urlparse
          u = os.environ.get("HOST", "")
          needles = [x for x in (u, urlparse(u).netloc) if x]
          for line in sys.stdin:
              for n in needles:
                  line = line.replace(n, "[staging]")
              print(line, end="")
          ' > sanitized/summary.txt

      - name: Upload sanitized summary (staging)
        if: ${{ always() && inputs.target == 'staging' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-staging-summary
          path: sanitized/summary.txt
          retention-days: 30

      - name: Create test summary
        if: always()
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
          TESTS_OUTCOME: ${{ steps.e2e-tests.outcome }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            echo "## 🎭 Full E2E Test Results"
            echo ""

            if [ -n "$TEST_FILTER" ]; then
              echo "**Filter:** \`$TEST_FILTER\`"
              echo ""
            fi

            if [ -f "app/e2e/test-results/results.json" ]; then
              PASSED=$(jq '.stats.expected // 0' app/e2e/test-results/results.json)
              FAILED=$(jq '.stats.unexpected // 0' app/e2e/test-results/results.json)
              SKIPPED=$(jq '.stats.skipped // 0' app/e2e/test-results/results.json)
              DURATION_MIN=$(jq '((.stats.duration // 0) / 60000) | floor' app/e2e/test-results/results.json)

              echo "| Metric | Count |"
              echo "|--------|-------|"
              echo "| ✅ Passed | $PASSED |"
              echo "| ❌ Failed | $FAILED |"
              echo "| ⏭️ Skipped | $SKIPPED |"
              echo "| ⏱️ Duration | ${DURATION_MIN}m |"
              echo ""

              if [ "$TESTS_OUTCOME" == "failure" ]; then
                echo "> ⚠️ **Some tests failed.** Open the [Playwright report](${REPORT_URL:-#artifacts}) for details."
              else
                echo "> ✅ **All tests passed!**"
              fi
            else
              echo "⚠️ No test results found. Tests may have failed to start or timed out."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce E2E result integrity
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.e2e-tests.outcome }}
        run: |
          set -Eeuo pipefail

          if [ "$TESTS_OUTCOME" != "success" ]; then
            echo "::error::E2E tests failed. Check the playwright-report-full artifact for details."
            exit 1
          fi

          RESULTS_FILE="app/e2e/test-results/results.json"
          if [ ! -s "$RESULTS_FILE" ]; then
            echo "::error::E2E results are missing or empty."
            exit 1
          fi

          FAILED="$(jq -er '.stats.unexpected // 0' "$RESULTS_FILE")"
          if ! [[ "$FAILED" =~ ^[0-9]+$ ]] || (( FAILED > 0 )); then
            echo "::error::E2E results contain ${FAILED} unexpected failures."
            exit 1
          fi
