name: SRE Eval Gate

on:
  pull_request:
    paths:
      - "app/package.json"
      - "app/package-lock.json"
      - "app/scripts/sre-eval-*.js"
      - "app/src/actions/sre-*.ts"
      - "app/src/app/api/sre/**"
      - "app/src/components/sre/**"
      - "app/src/lib/sre/**"
      - ".github/workflows/sre-eval.yml"
  push:
    branches:
      - main
    paths:
      - "app/package.json"
      - "app/package-lock.json"
      - "app/scripts/sre-eval-*.js"
      - "app/src/actions/sre-*.ts"
      - "app/src/app/api/sre/**"
      - "app/src/components/sre/**"
      - "app/src/lib/sre/**"
      - ".github/workflows/sre-eval.yml"

jobs:
  deterministic-sre-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run SRE eval release gate
        run: npm run test:sre-eval:release
