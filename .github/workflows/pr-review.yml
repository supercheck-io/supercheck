# Runs only for internal PRs; reviewer scripts come from the trusted default branch.
# Fork PRs have no secrets and are skipped. Artifacts are read only as data.
# Model and publisher run separately so no process holds both credentials.
# Advisory only: do not make this workflow a required merge check.
name: Code review agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to review
        required: true
        type: string

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pull_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    name: Decide whether to review
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.prepare.outputs.decision }}
      script_sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checkout review script from the default branch
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Classify the pull request
        id: prepare
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          REVIEW_DIR: ${{ runner.temp }}/pr-review
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-review.mjs prepare

      - name: Upload review input
        if: steps.prepare.outputs.decision != 'skip'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr-review/prompt.txt
            ${{ runner.temp }}/pr-review/index.json
            ${{ runner.temp }}/pr-review/meta.json
          overwrite: true
          retention-days: 1

  model:
    name: Review
    needs: prepare
    if: needs.prepare.outputs.decision == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted review script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.script_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download review input
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-review-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-review

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Request a review without tools
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REVIEW_DIR: ${{ runner.temp }}/pr-review
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: node .github/scripts/pr-review.mjs model

      - name: Upload the review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-review-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr-review/review.json
            ${{ runner.temp }}/pr-review/meta.json
          overwrite: true
          retention-days: 1

  publish:
    name: Post the review
    needs: [prepare, model]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.decision != 'skip' &&
      (needs.model.result == 'success' || needs.model.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout review script from the base branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.script_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download review input
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-review-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-review

      - name: Download model result
        if: needs.prepare.outputs.decision == 'review'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-review-result-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-review-result

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Publish the GitHub review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
          REVIEW_DIR: ${{ needs.prepare.outputs.decision == 'review' && format('{0}/pr-review-result', runner.temp) || format('{0}/pr-review', runner.temp) }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-review.mjs publish
