# Publishes the Supercheck Recorder browser extension to the Chrome Web Store
# and Microsoft Edge Add-ons.
#
# Release flow:
#   1. Bump the version in
#      recorder/examples/recorder-crx/public/manifest.json (and package.json).
#   2. Merge to main.
#   3. Tag the merge commit with an annotated, signed tag:
#      git tag -s recorder-v<version> && git push origin recorder-v<version>
#   The tag must match the manifest version and be signed by a key in
#   .github/release-allowed-signers, or the run fails before publishing.
#
# Required repository/environment secrets:
#   BPP_KEYS - JSON credentials consumed by PlasmoHQ/bpp, e.g.
#     {
#       "chrome": {
#         "extId": "<chrome extension id>",
#         "clientId": "<oauth client id>",
#         "clientSecret": "<oauth client secret>",
#         "refreshToken": "<oauth refresh token>"
#       },
#       "edge": {
#         "productId": "<edge product id>",
#         "clientId": "<partner center api client id>",
#         "apiKey": "<partner center api key>"
#       }
#     }
#
# The `publish` job targets the `recorder-release` environment so credentials
# can be gated behind required reviewers. Store submission fails loudly when
# BPP_KEYS is unset; the build and GitHub release jobs do not depend on it, so a
# tag still produces a sideloadable ZIP while store credentials are pending.

name: Publish Recorder Extension

on:
  push:
    tags: ["recorder-v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and validate the package without publishing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: recorder-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: recorder
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Release tags must be annotated and signed by a key listed in
      # main's .github/release-allowed-signers. The signers file is read
      # from main, not from the tagged commit, so a tag cannot add its own key.
      - name: Checkout release signers from main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: release-signers
          sparse-checkout: .github/release-allowed-signers
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Require signed annotated release tag
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -Eeuo pipefail
          if [[ "$RELEASE_REF" != refs/tags/* ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Dry run on $RELEASE_REF; tag check skipped."
              exit 0
            fi
            echo "::error::Publishing requires a signed release tag; got $RELEASE_REF."
            exit 1
          fi
          # actions/checkout fetches the tag as a bare commit
          # (+<sha>:refs/tags/<tag>), overwriting the annotated tag object.
          # Re-fetch the real tag object before verifying it.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "::error::Tag $RELEASE_TAG is lightweight or missing. Release tags must be annotated and signed."
            exit 1
          fi
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/release-signers/.github/release-allowed-signers" \
            verify-tag "refs/tags/$RELEASE_TAG"
          # The verified tag must still point at the commit this run builds.
          if [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG no longer points at $GITHUB_SHA."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: recorder/package-lock.json

      - name: Read and verify extension version
        id: version
        run: |
          manifest_version=$(node -p "require('./examples/recorder-crx/public/manifest.json').version")
          package_version=$(node -p "require('./examples/recorder-crx/package.json').version")
          if [ "$manifest_version" != "$package_version" ]; then
            echo "::error::recorder/examples/recorder-crx manifest.json ($manifest_version) and package.json ($package_version) versions differ"
            exit 1
          fi
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
          echo "Extension version: $manifest_version"

      - name: Verify release tag matches extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#recorder-v}"
          if [ "$tag_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match extension version '${{ steps.version.outputs.version }}'. Bump recorder/examples/recorder-crx/public/manifest.json first."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build recorder and extension
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Package extension
        run: |
          for file in LICENSE NOTICE playwright/LICENSE playwright/NOTICE; do
            cmp "$file" "examples/recorder-crx/dist/$file"
          done
          cd examples/recorder-crx/dist
          zip -r "../supercheck-recorder-v${{ steps.version.outputs.version }}.zip" .

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: supercheck-recorder
          path: recorder/examples/recorder-crx/supercheck-recorder-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to browser stores
    needs: build
    if: github.event_name == 'push' || inputs.dry-run == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: recorder-release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download package artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: supercheck-recorder
          path: recorder/examples/recorder-crx

      - name: Submit to Chrome Web Store and Edge Add-ons
        uses: PlasmoHQ/bpp@c15984c0a74f452851c605cab46f34d9fd6cb158 # v3.8.0
        with:
          keys: ${{ secrets.BPP_KEYS }}
          chrome-file: recorder/examples/recorder-crx/supercheck-recorder-v${{ needs.build.outputs.version }}.zip
          edge-file: recorder/examples/recorder-crx/supercheck-recorder-v${{ needs.build.outputs.version }}.zip
          edge-notes: "Supercheck Recorder v${{ needs.build.outputs.version }}"
          version-file: recorder/examples/recorder-crx/public/manifest.json

  release:
    name: Create GitHub release
    # Deliberately depends on build only: the ZIP is useful for QA, self-hosted,
    # and air-gapped installs even when store submission is unconfigured or the
    # store API is down. A failed publish stays red on its own job.
    needs: [build]
    # A dry-run dispatch from a tag must not create a real release.
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.dry-run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: supercheck-recorder
          path: release-assets

      # Lets self-hosted and enterprise installs verify the ZIP they sideload
      # against the artifact that was submitted to the stores.
      - name: Generate checksums
        run: cd release-assets && sha256sum ./*.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.zip \
            release-assets/SHA256SUMS.txt \
            --title "Supercheck Recorder v${GITHUB_REF_NAME#recorder-v}" \
            --generate-notes \
            --verify-tag \
            --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
