name: PR Validation

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

# Explicit permissions following least-privilege principle
permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Changed Areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.areas.outputs.core }}
      cli: ${{ steps.areas.outputs.cli }}
      e2e: ${{ steps.areas.outputs.e2e }}
      tools: ${{ steps.areas.outputs.tools }}

    steps:
      - name: Checkout code with comparison history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Skips package jobs a pull request cannot affect. App and worker share the
      # schema contract and migrations, so they always run together. Pushes and
      # manual runs check everything.
      - name: Detect changed areas
        id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            printf 'core=true\ncli=true\ne2e=true\ntools=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames counts both sides of a move, so the package losing a file is checked too.
          changed="$(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}")"
          shared='^(\.github/workflows/pr-validation\.yml|\.github/scripts/jest-summary\.mjs|\.nvmrc)$'
          # area NAME PATTERN [FILES]: true when any changed file matches.
          area() {
            if grep -qE "$shared|$2" <<< "${3-$changed}"; then echo "$1=true"; else echo "$1=false"; fi
          }
          {
            # deploy/docker is covered by app/scripts/docker-compose-profiles.spec.js in the app job.
            area core '^((app|worker)/|deploy/docker/)' "$(grep -v '^app/e2e/' <<< "$changed" || true)"
            area cli '^cli/'
            area e2e '^app/e2e/'
            area tools '^tools/'
          } | tee -a "$GITHUB_OUTPUT" | {
            echo "## Changed areas"
            echo ""
            echo "| Area | Checks run |"
            echo "| --- | --- |"
            while IFS='=' read -r name value; do
              if [ "$value" = "true" ]; then echo "| $name | ✅ yes |"; else echo "| $name | ⏭️ skipped (no change) |"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code with comparison history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enforce append-only, non-destructive migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No comparison SHA is available; migration safety is covered on pull requests and pushes."
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            comparison_range="${BASE_SHA}...${HEAD_SHA}"
          else
            comparison_range="${BASE_SHA}..${HEAD_SHA}"
          fi

          migration_changes=()
          while IFS= read -r change; do
            migration_changes+=("$change")
          done < <(git diff --name-status --find-renames "$comparison_range" -- 'app/src/db/migrations/*.sql')
          migrations=()
          immutable_changes=()
          for change in "${migration_changes[@]}"; do
            IFS=$'\t' read -r status first_path second_path <<< "$change"
            if [ "$status" = "A" ]; then
              migrations+=("$first_path")
            else
              immutable_changes+=("$status $first_path${second_path:+ -> $second_path}")
            fi
          done

          if [ "${#immutable_changes[@]}" -gt 0 ]; then
            echo "::error::Existing SQL migrations are immutable; add a new migration instead."
            printf ' - %s\n' "${immutable_changes[@]}"
            printf '## ❌ Migration safety\n\nExisting SQL migrations were changed; add a new migration instead.\n\n' >> "$GITHUB_STEP_SUMMARY"
            printf -- "- \`%s\`\n" "${immutable_changes[@]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # The journal must agree with the files even when a change only touches meta/ (no new .sql file).
          node app/scripts/check-migration-safety.js --journal app/src/db/migrations

          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "No new migrations."
            printf '## ✅ Migration safety\n\nNo new migrations; the journal matches the migration files.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node app/scripts/check-migration-safety.js "${migrations[@]}"
          printf '## ✅ Migration safety\n\nNew migrations are append-only and non-destructive:\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- "- \`%s\`\n" "${migrations[@]}" >> "$GITHUB_STEP_SUMMARY"

  app-quality-checks:
    name: App Quality Checks
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: supercheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci --prefer-offline --no-audit

      - name: Restore Jest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.jest-cache
          key: node-v24-jest-app-${{ hashFiles('app/jest.config.js', 'app/package-lock.json') }}
          restore-keys: node-v24-jest-app-

      - name: Type check
        working-directory: ./app
        run: npx tsc --noEmit

      - name: Lint code
        working-directory: ./app
        run: npm run lint -- --max-warnings 0

      - name: Run tests
        id: tests
        working-directory: ./app
        shell: bash
        run: |
          set -o pipefail
          npm run test:cov -- --maxWorkers=2 --cacheDirectory=.jest-cache \
            --json --outputFile="$RUNNER_TEMP/jest-app.json" --reporters=default --reporters=github-actions \
            2>&1 | tee "$RUNNER_TEMP/jest-app.log"
          if grep -qE "A worker process has failed to exit gracefully|Jest did not exit" "$RUNNER_TEMP/jest-app.log"; then
            echo "::error::Jest reported a leaked handle (app): a spec left a client/timer open. Release certification runs in-band and would hang."
            exit 1
          fi
        env:
          NODE_ENV: test
          TEST_REDIS_URL: redis://localhost:6381

      - name: Upload coverage
        id: coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: app-coverage
          path: app/coverage
          retention-days: 7

      - name: Write test summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node .github/scripts/jest-summary.mjs
        env:
          SUMMARY_TITLE: App unit tests
          JEST_RESULTS: ${{ runner.temp }}/jest-app.json
          COVERAGE_SUMMARY: app/coverage/coverage-summary.json
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          ARTIFACT_URL: ${{ steps.coverage.outputs.artifact-url }}

      - name: Run database integration tests
        working-directory: ./app
        run: npm run test:db
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/supercheck_test

      - name: Build check
        working-directory: ./app
        run: npm run build:webpack
        env:
          SKIP_ENV_VALIDATION: true

  worker-quality-checks:
    name: Worker Quality Checks
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: execution_usage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: ./worker
        run: npm ci --prefer-offline --no-audit

      - name: Restore Jest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: worker/.jest-cache
          key: node-v24-jest-worker-${{ hashFiles('worker/jest.config.js', 'worker/package-lock.json') }}
          restore-keys: node-v24-jest-worker-

      - name: Type check
        working-directory: ./worker
        run: npx tsc --noEmit

      - name: Lint code
        working-directory: ./worker
        run: npm run lint:check

      - name: Run tests
        id: tests
        working-directory: ./worker
        shell: bash
        run: |
          set -o pipefail
          npm run test:cov -- --maxWorkers=2 --cacheDirectory=.jest-cache \
            --json --outputFile="$RUNNER_TEMP/jest-worker.json" --reporters=default --reporters=github-actions \
            2>&1 | tee "$RUNNER_TEMP/jest-worker.log"
          if grep -qE "A worker process has failed to exit gracefully|Jest did not exit" "$RUNNER_TEMP/jest-worker.log"; then
            echo "::error::Jest reported a leaked handle (worker): a spec left a client/timer open. Release certification runs in-band and would hang."
            exit 1
          fi
        env:
          NODE_ENV: test
          EXECUTION_USAGE_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/execution_usage_test
          MONITOR_CYCLE_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres

      - name: Run database integration tests
        working-directory: ./worker
        run: npm run test:db
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres

      - name: Verify execution admission against PostgreSQL
        working-directory: ./worker
        run: npm test -- --rootDir . --setupFilesAfterEnv ./jest.setup.ts --runInBand --runTestsByPath test/execution-admission.db.spec.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/execution_usage_test

      - name: Verify queue fairness against Redis
        working-directory: ./worker
        run: npm test -- --rootDir . --setupFilesAfterEnv ./jest.setup.ts --runInBand --runTestsByPath test/execution-fairness.redis.spec.ts
        env:
          TEST_REDIS_URL: redis://localhost:6379

      - name: Upload coverage
        id: coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: worker-coverage
          path: worker/coverage
          retention-days: 7

      - name: Write test summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node .github/scripts/jest-summary.mjs
        env:
          SUMMARY_TITLE: Worker unit tests
          JEST_RESULTS: ${{ runner.temp }}/jest-worker.json
          COVERAGE_SUMMARY: worker/coverage/coverage-summary.json
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          ARTIFACT_URL: ${{ steps.coverage.outputs.artifact-url }}

      - name: Build check
        working-directory: ./worker
        run: npm run build

  cli-quality-checks:
    name: CLI Quality Checks
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: ./cli
        run: npm ci --prefer-offline --no-audit

      - name: Type check
        working-directory: ./cli
        run: npm run typecheck

      - name: Lint code
        working-directory: ./cli
        run: npm run lint

      - name: Run tests
        id: tests
        working-directory: ./cli
        run: >-
          npm run test:cov -- --maxWorkers=2
          --json --outputFile="$RUNNER_TEMP/jest-cli.json" --reporters=default --reporters=github-actions

      - name: Upload coverage
        id: coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: cli-coverage
          path: cli/coverage
          retention-days: 7

      - name: Write test summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node .github/scripts/jest-summary.mjs
        env:
          SUMMARY_TITLE: CLI unit tests
          JEST_RESULTS: ${{ runner.temp }}/jest-cli.json
          COVERAGE_SUMMARY: cli/coverage/coverage-summary.json
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          ARTIFACT_URL: ${{ steps.coverage.outputs.artifact-url }}

      - name: Build package
        working-directory: ./cli
        run: npm run build

      - name: Verify package contents
        working-directory: ./cli
        run: npm pack --dry-run

  tools-api-quality-checks:
    name: Free Tools API Checks
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: tools/package-lock.json

      - name: Install dependencies
        working-directory: ./tools
        run: npm ci --prefer-offline --no-audit

      - name: Type check
        working-directory: ./tools
        run: npm run typecheck

      # Runs in workerd via Miniflare; outbound fetches are mocked, so no secret is needed.
      - name: Run tests with coverage
        working-directory: ./tools
        run: npm run test:cov

      - name: Bundle check
        working-directory: ./tools
        run: npm run size

  e2e-quality-checks:
    name: E2E Suite Quality Checks
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: ./app/e2e
        run: npm ci --prefer-offline --no-audit

      - name: Type check E2E suite
        working-directory: ./app/e2e
        run: npx tsc --noEmit -p tsconfig.json

      - name: Verify Playwright discovery
        working-directory: ./app/e2e
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --list | tee "$RUNNER_TEMP/e2e-list.txt"
          # Playwright ends the listing with "Total: N tests in M files".
          printf '## ✅ E2E suite\n\nTypes check and Playwright discovers the suite: %s\n' \
            "$(grep -E '^Total: ' "$RUNNER_TEMP/e2e-list.txt" | tail -1 || echo 'see the job log')" >> "$GITHUB_STEP_SUMMARY"

  deploy-validation:
    name: Deploy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The reporter test imports a .ts file, which needs Node's built-in type stripping.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify licenses and distribution notices
        id: licenses
        run: node .github/scripts/check-licenses.mjs

      - name: Test CI scripts
        id: scripts
        run: node --test .github/scripts/pr-screenshots.test.mjs .github/scripts/jest-summary.test.mjs app/e2e/scripts/mock-ai.test.mjs app/e2e/reporters/priority-skip-reporter.test.mjs

      - name: Validate Compose files and deploy scripts
        id: compose
        run: ./deploy/docker/validate.sh

      - name: Ensure ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: ShellCheck deploy and CI scripts
        id: shellcheck
        run: |
          shellcheck \
            deploy/docker/*.sh \
            .github/scripts/*.sh \
            app/scripts/*.sh

      - name: Lint GitHub Actions workflows
        id: actionlint
        run: |
          ACTIONLINT_VERSION="1.7.12"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # Abort only stalled transfers (<1 KB/s for 30s) so slow but progressing downloads finish.
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 --speed-limit 1024 --speed-time 30 -o "/tmp/${tarball}" "${base}/${tarball}"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 --speed-limit 1024 --speed-time 30 -o /tmp/actionlint_checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd /tmp && grep -F "${tarball}" actionlint_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${tarball}" -C /tmp actionlint
          # actionlint also runs ShellCheck on inline "run:" blocks when it is
          # available on PATH (installed in the step above). Repository shell
          # scripts are linted directly in the previous step.
          /tmp/actionlint .github/workflows/*.yml

      - name: Lint Dockerfiles
        id: hadolint
        run: |
          HADOLINT_VERSION="2.15.1"
          base="https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 --speed-limit 1024 --speed-time 30 -o /tmp/hadolint-linux-x86_64 "${base}/hadolint-linux-x86_64"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 --speed-limit 1024 --speed-time 30 -o /tmp/hadolint_checksums.txt "${base}/checksums.sha256"
          (cd /tmp && grep 'hadolint-linux-x86_64$' hadolint_checksums.txt | sha256sum -c -)
          chmod +x /tmp/hadolint-linux-x86_64
          # Vendored Playwright Dockerfiles are reviewed upstream.
          dockerfiles=()
          while IFS= read -r file; do
            dockerfiles+=("$file")
          done < <(git ls-files '*Dockerfile*' | grep -v '^recorder/playwright/' | grep -v '\.dockerignore$')
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "No Dockerfiles found"
            exit 0
          fi
          /tmp/hadolint-linux-x86_64 "${dockerfiles[@]}"

      - name: Write summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >-
          .github/scripts/checks-summary.sh "Deploy validation"
          "Licenses and notices=${{ steps.licenses.outcome }}"
          "CI script tests=${{ steps.scripts.outcome }}"
          "Compose files and deploy scripts=${{ steps.compose.outcome }}"
          "ShellCheck=${{ steps.shellcheck.outcome }}"
          "actionlint=${{ steps.actionlint.outcome }}"
          "hadolint=${{ steps.hadolint.outcome }}"

  summary:
    name: Quality Checks Summary
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changes, migration-safety, app-quality-checks, worker-quality-checks, cli-quality-checks, tools-api-quality-checks, e2e-quality-checks, deploy-validation]
    if: always()

    steps:
      # A job skipped because its area did not change is a pass; anything else must succeed.
      - name: Check results
        env:
          RESULTS: >-
            changes=${{ needs.changes.result }}
            migration-safety=${{ needs.migration-safety.result }}
            app=${{ needs.app-quality-checks.result }}
            worker=${{ needs.worker-quality-checks.result }}
            cli=${{ needs.cli-quality-checks.result }}
            tools-api=${{ needs.tools-api-quality-checks.result }}
            e2e=${{ needs.e2e-quality-checks.result }}
            deploy-validation=${{ needs.deploy-validation.result }}
        run: |
          failed=0
          for entry in $RESULTS; do
            echo "$entry"
            case "$entry" in
              changes=success|migration-safety=success|deploy-validation=success) ;;
              changes=*|migration-safety=*|deploy-validation=*) failed=1 ;;
              *=success|*=skipped) ;;
              *) failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "❌ Quality checks failed"
            exit 1
          fi
          echo "✅ All quality checks passed"

      # One table that links every job, so nobody has to open each job to find the failure.
      - name: Write run summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2016 # jq program, not shell
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '
            def dur: if .started_at and .completed_at
              then ((.completed_at | fromdate) - (.started_at | fromdate)) as $s
                | if $s < 60 then "\($s)s" else "\($s / 60 | floor)m \($s % 60)s" end
              else "–" end;
            .jobs[]
            | select(.name != "Quality Checks Summary")
            | "| [\(.name)](\(.html_url)) | \(
                { success: "✅ passed", failure: "❌ failed", cancelled: "🚫 cancelled",
                  skipped: "⏭️ skipped (no change)", timed_out: "⏱️ timed out" }[.conclusion // ""]
                // "⏳ \(.status)") | \(dur) |"' > "$RUNNER_TEMP/jobs.md"
          {
            echo "## Quality checks"
            echo ""
            echo "| Job | Result | Duration |"
            echo "| --- | --- | ---: |"
            cat "$RUNNER_TEMP/jobs.md"
            echo ""
            echo "Open a job for its test counts, coverage and failing tests."
          } >> "$GITHUB_STEP_SUMMARY"
