name: PR Validation

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

# Explicit permissions following least-privilege principle
permissions:
  contents: read
  actions: read

jobs:
  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code with comparison history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enforce append-only, non-destructive migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No comparison SHA is available; migration safety is covered on pull requests and pushes."
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            comparison_range="${BASE_SHA}...${HEAD_SHA}"
          else
            comparison_range="${BASE_SHA}..${HEAD_SHA}"
          fi

          migration_changes=()
          while IFS= read -r change; do
            migration_changes+=("$change")
          done < <(git diff --name-status --find-renames "$comparison_range" -- 'app/src/db/migrations/*.sql')
          migrations=()
          immutable_changes=()
          for change in "${migration_changes[@]}"; do
            IFS=$'\t' read -r status first_path second_path <<< "$change"
            if [ "$status" = "A" ]; then
              migrations+=("$first_path")
            else
              immutable_changes+=("$status $first_path${second_path:+ -> $second_path}")
            fi
          done

          if [ "${#immutable_changes[@]}" -gt 0 ]; then
            echo "::error::Existing SQL migrations are immutable; add a new migration instead."
            printf ' - %s\n' "${immutable_changes[@]}"
            exit 1
          fi

          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "No new migrations."
            exit 0
          fi

          node app/scripts/check-migration-safety.js "${migrations[@]}"

  app-quality-checks:
    name: App Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci --prefer-offline --no-audit

      - name: Restore Jest cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/.jest-cache
          key: node-v22-jest-app-${{ hashFiles('app/jest.config.js', 'app/package-lock.json') }}
          restore-keys: node-v22-jest-app-

      - name: Type check
        working-directory: ./app
        run: npx tsc --noEmit

      - name: Lint code
        working-directory: ./app
        run: npm run lint -- --max-warnings 0

      - name: Run tests
        working-directory: ./app
        run: npm run test:cov -- --maxWorkers=2 --cacheDirectory=.jest-cache
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: app-coverage
          path: app/coverage
          retention-days: 7

      - name: Build check
        working-directory: ./app
        run: npm run build:webpack
        env:
          SKIP_ENV_VALIDATION: true

  worker-quality-checks:
    name: Worker Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: ./worker
        run: npm ci --prefer-offline --no-audit

      - name: Restore Jest cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: worker/.jest-cache
          key: node-v22-jest-worker-${{ hashFiles('worker/jest.config.js', 'worker/package-lock.json') }}
          restore-keys: node-v22-jest-worker-

      - name: Type check
        working-directory: ./worker
        run: npx tsc --noEmit

      - name: Lint code
        working-directory: ./worker
        run: npx eslint "src/**/*.ts"

      - name: Run tests
        working-directory: ./worker
        run: npm run test:cov -- --maxWorkers=2 --cacheDirectory=.jest-cache
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: worker-coverage
          path: worker/coverage
          retention-days: 7

      - name: Build check
        working-directory: ./worker
        run: npm run build

  cli-quality-checks:
    name: CLI Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: ./cli
        run: npm ci --prefer-offline --no-audit

      - name: Type check
        working-directory: ./cli
        run: npm run typecheck

      - name: Lint code
        working-directory: ./cli
        run: npm run lint

      - name: Run tests
        working-directory: ./cli
        run: npm test

      - name: Build package
        working-directory: ./cli
        run: npm run build

      - name: Verify package contents
        working-directory: ./cli
        run: npm pack --dry-run

  e2e-quality-checks:
    name: E2E Suite Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: ./app/e2e
        run: npm ci --prefer-offline --no-audit

      - name: Type check E2E suite
        working-directory: ./app/e2e
        run: npx tsc --noEmit -p tsconfig.json

      - name: Verify Playwright discovery
        working-directory: ./app/e2e
        run: npx playwright test --list

  deploy-validation:
    name: Deploy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Compose files and deploy scripts
        run: ./deploy/docker/validate.sh

      - name: Ensure ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: ShellCheck deploy and CI scripts
        run: |
          shellcheck \
            deploy/docker/*.sh \
            .github/scripts/*.sh \
            app/scripts/*.sh

      - name: Lint GitHub Actions workflows
        run: |
          ACTIONLINT_VERSION="1.7.7"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" "${base}/${tarball}"
          curl -fsSL -o /tmp/actionlint_checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd /tmp && grep -F "${tarball}" actionlint_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${tarball}" -C /tmp actionlint
          # actionlint also runs ShellCheck on inline "run:" blocks when it is
          # available on PATH (installed in the step above). Repository shell
          # scripts are linted directly in the previous step.
          /tmp/actionlint .github/workflows/*.yml

      - name: Lint Dockerfiles
        run: |
          HADOLINT_VERSION="2.15.1"
          base="https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}"
          curl -fsSL -o /tmp/hadolint-linux-x86_64 "${base}/hadolint-linux-x86_64"
          curl -fsSL -o /tmp/hadolint_checksums.txt "${base}/checksums.sha256"
          (cd /tmp && grep 'hadolint-linux-x86_64$' hadolint_checksums.txt | sha256sum -c -)
          chmod +x /tmp/hadolint-linux-x86_64
          # Vendored Playwright Dockerfiles are reviewed upstream.
          dockerfiles=()
          while IFS= read -r file; do
            dockerfiles+=("$file")
          done < <(git ls-files '*Dockerfile*' | grep -v '^recorder/playwright/')
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "No Dockerfiles found"
            exit 0
          fi
          /tmp/hadolint-linux-x86_64 "${dockerfiles[@]}"

  summary:
    name: Quality Checks Summary
    runs-on: ubuntu-latest
    needs: [migration-safety, app-quality-checks, worker-quality-checks, cli-quality-checks, e2e-quality-checks, deploy-validation]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.migration-safety.result }}" != "success" ] || [ "${{ needs.app-quality-checks.result }}" != "success" ] || [ "${{ needs.worker-quality-checks.result }}" != "success" ] || [ "${{ needs.cli-quality-checks.result }}" != "success" ] || [ "${{ needs.e2e-quality-checks.result }}" != "success" ] || [ "${{ needs.deploy-validation.result }}" != "success" ]; then
            echo "❌ Quality checks failed"
            echo "Migration safety: ${{ needs.migration-safety.result }}"
            echo "App checks: ${{ needs.app-quality-checks.result }}"
            echo "Worker checks: ${{ needs.worker-quality-checks.result }}"
            echo "CLI checks: ${{ needs.cli-quality-checks.result }}"
            echo "E2E suite checks: ${{ needs.e2e-quality-checks.result }}"
            echo "Deploy validation: ${{ needs.deploy-validation.result }}"
            exit 1
          else
            echo "✅ All quality checks passed"
          fi
