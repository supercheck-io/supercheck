name: PR Validation

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

# Explicit permissions following least-privilege principle
permissions:
  contents: read
  actions: read

jobs:
  app-quality-checks:
    name: App Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci --prefer-offline --no-audit

      - name: Restore Jest cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/.jest-cache
          key: node-v22-jest-app-${{ hashFiles('app/jest.config.js', 'app/package-lock.json') }}
          restore-keys: node-v22-jest-app-

      - name: Type check
        working-directory: ./app
        run: npx tsc --noEmit

      - name: Lint code
        working-directory: ./app
        run: npm run lint -- --max-warnings 0

      - name: Run tests
        working-directory: ./app
        run: npm run test:cov -- --maxWorkers=2 --cacheDirectory=.jest-cache
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: app-coverage
          path: app/coverage
          retention-days: 7

      - name: Build check
        working-directory: ./app
        run: npm run build:webpack
        env:
          SKIP_ENV_VALIDATION: true

  worker-quality-checks:
    name: Worker Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: ./worker
        run: npm ci --prefer-offline --no-audit

      - name: Restore Jest cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: worker/.jest-cache
          key: node-v22-jest-worker-${{ hashFiles('worker/jest.config.js', 'worker/package-lock.json') }}
          restore-keys: node-v22-jest-worker-

      - name: Type check
        working-directory: ./worker
        run: npx tsc --noEmit

      - name: Lint code
        working-directory: ./worker
        run: npx eslint "src/**/*.ts"

      - name: Run tests
        working-directory: ./worker
        run: npm run test:cov -- --maxWorkers=2 --cacheDirectory=.jest-cache
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: worker-coverage
          path: worker/coverage
          retention-days: 7

      - name: Build check
        working-directory: ./worker
        run: npm run build

  e2e-quality-checks:
    name: E2E Suite Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: ./app/e2e
        run: npm ci --prefer-offline --no-audit

      - name: Type check E2E suite
        working-directory: ./app/e2e
        run: npx tsc --noEmit -p tsconfig.json

      - name: Verify Playwright discovery
        working-directory: ./app/e2e
        run: npx playwright test --list

  summary:
    name: Quality Checks Summary
    runs-on: ubuntu-latest
    needs: [app-quality-checks, worker-quality-checks, e2e-quality-checks]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.app-quality-checks.result }}" != "success" ] || [ "${{ needs.worker-quality-checks.result }}" != "success" ] || [ "${{ needs.e2e-quality-checks.result }}" != "success" ]; then
            echo "❌ Quality checks failed"
            echo "App checks: ${{ needs.app-quality-checks.result }}"
            echo "Worker checks: ${{ needs.worker-quality-checks.result }}"
            echo "E2E suite checks: ${{ needs.e2e-quality-checks.result }}"
            exit 1
          else
            echo "✅ All quality checks passed"
          fi
