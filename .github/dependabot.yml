version: 2

# Version-update PRs are paused: every entry has open-pull-requests-limit: 0.
# Raise a limit to resume updates for that directory; the ignore lists below
# still apply when resumed (lift an ignore only with the migration it needs).
# Security updates are a separate repository setting and are not affected.
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      app-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Table 9 removes the useReactTable API used by the app.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      # Anthropic provider 4 targets a model spec incompatible with AI SDK 6.
      - dependency-name: "@ai-sdk/anthropic"
        update-types: ["version-update:semver-major"]
      # drizzle-zod 0.8 emits Zod 4 schemas; callers still use Zod 3.
      - dependency-name: "drizzle-zod"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Newer Monaco vendors a DOMPurify with open advisories.
      - dependency-name: "monaco-editor"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # react-day-picker 10 changes Calendar classNames and the single-mode prop types.
      - dependency-name: "react-day-picker"
        update-types: ["version-update:semver-major"]
      # Keep @types/node on the supported Node runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /app/e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      app-e2e-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      worker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 removes the compiler API that ts-jest and ESLint rely on.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-zod"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # BullMQ 6 removes Queue.client, used by the queue status service.
      - dependency-name: "bullmq"
        update-types: ["version-update:semver-major"]
      # @types/node 22.20 changes the TLS certificate types read by the SSL monitor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      docs-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Newer Fumadocs removes translation-context .text, still read by OpenAPI.
      - dependency-name: "fumadocs-core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "fumadocs-ui"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # fumadocs-mdx 15 moves the generated .source output the docs import.
      - dependency-name: "fumadocs-mdx"
        update-types: ["version-update:semver-major"]
      # Mermaid 12 re-lays out and recolours existing diagrams; needs a visual review.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      cli-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Commander 15 requires Node 22.12+; the published CLI still supports Node 20.
      - dependency-name: "commander"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /tools-api
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      tools-api-minor-patch:
        update-types: ["minor", "patch"]

  # The recorder vendors upstream Playwright under recorder/playwright/**, which
  # is reviewed through the upstream security process. Only the recorder
  # workspace's own dependencies are maintained here.
  - package-ecosystem: npm
    directory: /recorder
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    exclude-paths:
      - "playwright/**"
    cooldown:
      default-days: 7
    groups:
      recorder-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # React 19 fails at runtime against the recorder's ReactDOM 18.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # The vendored CodeMirror is v5; the root package is not that dependency.
      - dependency-name: "codemirror"
        update-types: ["version-update:semver-major"]
      # Vite 8 (Rolldown) cannot resolve chromium-bidi imports in vendored Playwright.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      # Stay on the supported Node LTS line.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /cli
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
