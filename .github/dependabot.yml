version: 2

# Version updates run monthly and are grouped so a month produces a handful of
# PRs instead of one per package. Majors that are known to break this repo are
# ignored below; lift an ignore only together with the migration that needs it.
# Security updates are configured separately in repository settings and are not
# affected by the schedule.
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      app-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Table 9 removes the useReactTable API used by the app.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      # Anthropic provider 4 targets a model spec incompatible with AI SDK 6.
      - dependency-name: "@ai-sdk/anthropic"
        update-types: ["version-update:semver-major"]
      # drizzle-zod 0.8 emits Zod 4 schemas; callers still use Zod 3.
      - dependency-name: "drizzle-zod"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Newer Monaco vendors a DOMPurify with open advisories.
      - dependency-name: "monaco-editor"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Keep @types/node on the supported Node runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /app/e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      app-e2e-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      worker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 removes the compiler API that ts-jest and ESLint rely on.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-zod"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      docs-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Newer Fumadocs removes translation-context .text, still read by OpenAPI.
      - dependency-name: "fumadocs-core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "fumadocs-ui"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      cli-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The recorder vendors upstream Playwright under recorder/playwright/**, which
  # is reviewed through the upstream security process. Only the recorder
  # workspace's own dependencies are maintained here.
  - package-ecosystem: npm
    directory: /recorder
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    exclude-paths:
      - "playwright/**"
    cooldown:
      default-days: 7
    groups:
      recorder-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # React 19 fails at runtime against the recorder's ReactDOM 18.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # The vendored CodeMirror is v5; the root package is not that dependency.
      - dependency-name: "codemirror"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Stay on the supported Node LTS line.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /cli
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
