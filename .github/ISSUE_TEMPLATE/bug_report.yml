name: Bug report
description: Report a reproducible bug in Supercheck
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        > [!IMPORTANT]
        > Do not report security vulnerabilities here. Follow [SECURITY.md](https://github.com/supercheck-io/supercheck/blob/main/SECURITY.md) and use private vulnerability reporting.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched [existing issues](https://github.com/supercheck-io/supercheck/issues) and this has not already been reported.
          required: true
        - label: I included the affected version or commit when known.
          required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Supercheck is affected?
      options:
        - app (Next.js UI / API)
        - worker (NestJS execution)
        - cli (@supercheck/cli)
        - recorder (browser extension)
        - deploy (Docker Compose / K3s / gVisor)
        - docs
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, image digest, CLI version, or commit SHA, if known.
      placeholder: "1.3.6 / @supercheck/cli 0.1.4 / <commit sha> / unknown"
    validations:
      required: false

  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What actually happens?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps or commands. Include the smallest reproducible example.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets, tokens, tenant identifiers, and private URLs before pasting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Deployment mode, OS, browser, and runtime versions, where relevant.
      placeholder: |
        Deployment: self-hosted Docker Compose
        OS: Ubuntu 24.04
        Browser: Chrome 130
        Node.js: 20.x
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/supercheck-io/supercheck/blob/main/CODE_OF_CONDUCT.md).
          required: true
