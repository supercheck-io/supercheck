# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
tone_instructions: >-
  Be direct and technical. Prioritize correctness, security, tenant isolation,
  and actionable maintainability issues. Verify findings against surrounding
  code and legitimate scope exceptions. Avoid praise and duplicate CI findings.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  collapse_walkthrough: true
  # Keep the walkthrough to the summary and findings.
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    # One review per PR (on open). The OSS plan's hourly limit is shared by every
    # PR from one author, so per-push reviews exhaust it.
    # Comment "@coderabbitai review" to re-review after changes.
    auto_incremental_review: false
    # Stacked PRs (base is another feature branch) get their one review on open too;
    # otherwise their code is only reviewed again inside the parent PR.
    base_branches:
      - ".*"
    ignore_usernames:
      - "dependabot[bot]"
    ignore_title_keywords:
      - "skip-ai-review"
    labels:
      - "!skip-ai-review"
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/.next/**"
    - "!**/out/**"
    - "!**/coverage/**"
    - "!**/graphify-out/**"
    # Vendored and generated files: no review value, and they use up the review's file budget.
    - "!recorder/playwright/**"
    - "!**/package-lock.json"
    - "!app/src/db/migrations/meta/**"
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
    description:
      mode: warning
    issue_assessment:
      mode: warning
  tools:
    biome:
      enabled: false
    oxc:
      enabled: false
    opengrep:
      enabled: false
    sqlfluff:
      enabled: false
    trufflehog:
      enabled: false

chat:
  auto_reply: true
  allow_non_org_members: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: ".github/copilot-instructions.md"
        applyTo: "**/*"
      - files: ".github/review-rules.md"
        applyTo: "**/*"
  learnings:
    scope: local
